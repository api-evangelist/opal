status_page:
  published: false
  evidence: >-
    No status page was found. status.workwithopal.com does not resolve, and status.ouropal.com
    returns HTTP 200 only because *.ouropal.com is a wildcard that serves the Opal single-page app
    shell for any hostname (an unrelated random subdomain resolves to the same 20.94.255.92 and the
    same HTML). It is not a status document, so no StatusPage pointer is emitted.
  probed:
  - url: https://status.ouropal.com/
    status: 200
    result: wildcard SPA shell, not a status page
  - url: https://workwithopal.com/status/
    status: 404

sla:
  published: false
  note: >-
    No public SLA or uptime target. Pricing and terms are handled through sales; the API terms are
    published as an API License at https://workwithopal.com/api-license/.

access:
  gated: true
  note: >-
    The API documentation is public and unauthenticated at
    https://login.ouropal.com/api/documentation, but credentials are not self-serve. Opal's help
    center states access to the API requires an active account or an NDA plus approval from Opal
    leadership, and OAuth client registration "is currently a manual process" handled by the Opal
    integrations team.
  evidence: https://help.workwithopal.com/article/17imdltzi1-opal-api
