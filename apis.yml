- aid: opal:opal-stamps-api
  name: Opal Stamps API
  description: >-
    ## Stamps Overview


    In Opal, a Stamp acts as a pre-configured template for creating `moment`s or `content`. The `stamp_type`
    attribute specifies if the stamp is intended for moments or content.


    ### Types of Stamps


    - Moment Stamp: Incorporates all content, notes, and labels from a moment.

    - Content Stamp: Consists of copy, assets, workflow, notes, and labels. (Note: "Content" and "Post"
    are interchangeable terms.)


    ### Stamp Operations


    - Creating a Stamp: Use the Moment Shroud feature in the Opal application to establish a moment or
    content as a templated stamp. Creating a stamp via the REST API is not currently supported.

    - Managing Stamps: Opal admins can manage stamps via the Configure Workspace panel.

    - Retrieving Stamps: Fetch a list of stamps with the GET request /stamps/v2?brand_id={{brand_id}}.


    ### Using Stamps


    - In the REST API: Specify the `stamp_id` attribute when creating a `moment` to apply a chosen stamp.
    Note that applying a stamp via the REST API for `content` is not currently supported.

    - In the Opal Application: Use the "Apply Stamp" option in the moment shroud to apply a stamp to a
    newly-created moment or piece of content.
  humanURL: https://login.ouropal.com/api/documentation/v2
  baseURL: https://login.ouropal.com
