aid: opal
name: Opal
description: >-
  Opal is a marketing planning and content calendar platform that gives marketing teams a
  single visual workspace to plan campaigns, build editorial and content calendars, manage
  creative workflows and approvals, and connect strategy to execution across channels and
  markets. It is used by enterprise brands such as Target, Starbucks, GM, and SAP, and pairs a
  unified planning calendar with a "Gem" AI co-pilot plus prebuilt integrations to tools like
  Salesforce, Snowflake, Google Analytics, Google Sheets, and Zapier. Opal publishes a public
  marketing site, pricing, and a security/trust posture (SOC 2, ISO 27001, GDPR) but does not
  expose a public developer API, documentation portal, or SDK surface.
