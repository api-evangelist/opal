  description: >-
    ## Board Collaborators Overview

    Board Collaborators allow opal users to add other users as a collaborator on their **private** Boards.
    This allows the Collaborators to view and edit the Board as if they were the owner.


    Because **public** Boards are already available to any user in your Workspace, they do not require
    Board Collaborators. The endpoints are not available for these public Boards and will return error
    messages accordingly.
