- aid: opal:opal-asset-references-api
  name: Opal Asset References API
  description: >-
    ## Asset References Overview

    In Opal, you create `assets` to represent files uploaded to the platform and

    `asset_references` to surface those assets for use in the Asset Library,

    Moments, Content, and more.


    Before reading into the Asset Reference endpoints, look over the [Assets

    documentation](#tag/Assets).


    Once you've created an Asset, use its `id` as the `asset_uuid` for a new Asset

    Reference. You'll also likely also want to at least copy the Asset's `file_name`,

    `bytes`, and `url` over to the new Asset Reference (into the `filename`,

    `filesize`, and `full_url` fields, respectively).


    The one relationship that you probably want to make sure all of your new Asset

    References have is `brand`. The Brand (also known as the Workspace) must be

    specified for an Asset Reference to be available for use within the workspace

    you choose; it won't even show up in the Asset Library without a Workspace

    association.
  humanURL: https://login.ouropal.com/api/documentation/v2
  baseURL: https://login.ouropal.com
