apis:
- name: Opal API v2
  description: >-
    The stable REST surface of the Opal marketing planning platform — 66 paths and 97 operations
    across stories, moments, content, placements, assets, asset references, labels, label sets,
    stamps, brands, brand settings, accounts, activities, annotations, messages, reactions,
    budgets, rich text, workflows, workflow assignments/stages/responses and users. Endpoints in
    the JSON:API, Unstable and Proposed categories are JSON:API-compliant and expect
    `Accept: application/vnd.api+json`; "Other" endpoints are stable but plain `application/json`.
    Authenticated with OAuth 2.0 authorization code; a `Session-Token` header is still accepted
    but is documented as deprecated.
  humanURL: https://login.ouropal.com/api/documentation/v2
  baseURL: https://login.ouropal.com
  tags:
  - Marketing
  - Content Planning
  - Campaign Management
  - Workflow
  - Digital Asset Management
  - JSON:API
  - OAuth 2.0
  properties:
  - type: OpenAPI
    url: openapi/opal-v2-openapi.yml
  - type: Documentation
    url: https://login.ouropal.com/api/documentation/v2
  - type: APIReference
    url: https://login.ouropal.com/api/documentation/v2
  - type: Overlay
    url: overlays/opal-v2-overlay.yaml
- name: Opal API v3
  description: >-
    The next-generation Opal REST surface, published as work in progress — 97 paths and 154
    operations across boards, board objects and collections, board collaborators, blocks and block
    connectors, categories and charts, custom fields, views and view columns, filter sets, key
    dates, moments and moment schedules/assignees, content schedules, stories, rich text
    documents, presentation themes, user groups, workspaces, bulk operations, workflow
    assignments/stages/responses, channels and Gem chats/files. Resource identifiers are opaque
    UUIDv4 strings with the v2 identifier carried in `attributes.legacy_id`. Adds an anonymous
    OAuth 2.0 client-credentials flow scoped `write:onboarding` for trial provisioning, alongside
    the authorization-code flow.
  humanURL: https://login.ouropal.com/api/documentation/v3
  baseURL: https://login.ouropal.com
  tags:
  - Marketing
  - Content Planning
  - Campaign Management
  - Workflow
  - Collaboration
  - JSON:API
  - OAuth 2.0
  properties:
  - type: OpenAPI
    url: openapi/opal-v3-openapi.yml
  - type: Documentation
    url: https://login.ouropal.com/api/documentation/v3
  - type: APIReference
    url: https://login.ouropal.com/api/documentation/v3
  - type: Overlay
    url: overlays/opal-v3-overlay.yaml
- name: Opal Asgard BFF API
  description: >-
    A backend-for-frontend service published in the same public documentation set — 11 paths
    covering workspace-scoped blocks, smart blocks, smart categories, plans, in-market calendar
    and experimental plan/block reads, plus two operations that add moments to boards and plans.
    All operations are categorized Unstable, Proposed or Experimental, so Opal makes no stability
    guarantee for them. Authenticated with the deprecated `Session-Token` header only.
  humanURL: https://login.ouropal.com/api/documentation/asgard_bff
  baseURL: https://login.ouropal.com
  tags:
