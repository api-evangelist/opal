- aid: opal:opal-assets-api
  name: Opal Assets API
  description: >-
    ## Assets Overview

    Assets represent images, videos, PDFs, and any other file uploads. Any upload to

    the Opal platform must start with an `asset`. Some resources like `boards` can be

    directly related to an `asset` while other resources like `moments` require that

    you also create an `asset_reference` that further describes your `asset`.


    Assets can either be created by uploading data directly or by creating a Url

    Upload that requests an asset from some other publicly available web address and

    streams it to Opal. The former endpoint is described immediately below and the

    latter option can be found under the [Url Uploads](#tag/Url-Uploads) tag.


    Once you've created an Asset and you have its `id`, you'll likely want to create

    an [Asset Reference](#tag/Asset-References) as well, unless you don't want your asset exposed in the

    Asset Library or used with other resources you'll find to have asset reference

    relationships.
  humanURL: https://login.ouropal.com/api/documentation/v2
  baseURL: https://login.ouropal.com
