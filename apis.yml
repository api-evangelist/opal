aid: opal
name: Opal
description: >-
  Opal is a marketing planning and content calendar platform that gives marketing teams a
  single visual workspace to plan campaigns, build editorial and content calendars, manage
  creative workflows and approvals, and connect strategy to execution across channels and
  markets. It is used by enterprise brands such as Target, Starbucks, GM, and SAP, and pairs a
  unified planning calendar with a "Gem" AI co-pilot plus prebuilt integrations to Slack, Jira,
  Asana, Wrike, Workfront, Sprinklr, Khoros, Frame.io, Sprout Social, Formstack and Zapier.
  Opal does ship a real REST API: three OpenAPI 3.0 definitions — v2, v3 and an internal-facing
  Asgard BFF service — are served publicly from login.ouropal.com and cover stories, moments,
  content, boards, board objects, assets, asset references, labels, stamps, workflows, custom
  fields, presentations, rich-text documents and Gem chats. The v2 and v3 surfaces are
  JSON:API-compliant and authenticate with OAuth 2.0 authorization code (plus a client-credentials
  onboarding flow and a deprecated Session-Token header). The documentation is public, but API
  credentials are gated: Opal states access requires an active account or an NDA plus approval
  from Opal leadership, and OAuth client registration is a manual process handled by its
  integrations team.
