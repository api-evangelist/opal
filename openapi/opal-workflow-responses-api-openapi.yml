      operationId: ReadWorkflowResponseV3
      summary: Fetch a Response by ID
      security:
      - oauth2:
        - offline_access
      - api_key: []
      parameters:
      - name: workflow_response_id
        in: path
        required: true
        description: The ID of the workflow_response
        schema:
          type: string
          format: uuid
      - name: include
        in: query
        required: false
        description: 'A comma separated value of related resource objects on the response to include.

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - assignment
        style: form
        explode: false
      responses:
        '200':
          description: Successfully fetched workflow_response
          content:
            application/json:
