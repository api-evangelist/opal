openapi: 3.2.0
info:
  version: 3.0.0
  title: Opal API (⚠️ WIP) Board Objects API
  license:
    name: Opal API License
    url: https://www.workwithopal.com/api-license
  description: The key words “MUST”, “MUST NOT”, “REQUIRED”, “SHALL”, “SHALL NOT”, “SHOULD”, “SHOULD NOT”, “RECOMMENDED”, “NOT RECOMMENDED”, “MAY”, and “OPTIONAL” in this document are to be interpreted as described in BCP 14 [RFC2119] [RFC8174] when, and only when, they appear in all capitals, as shown here.
servers:
- url: https://login.ouropal.com
tags:
- name: Board Objects
  description: '## Overview

    - **Board**: A board is the parent container and encapsulates its Board Objects and Board Object Collections

    - **Board Object Collection**: A Board resource can have zero-or-many Board Object Collections.'
paths:
  /board_objects/v3:
    get:
      tags:
      - Board Objects
      operationId: ReadBoardObjectsV3
      x-Operation-ID: ReadBoardObjectsV3
      summary: Get Board Objects available to the authenticated user
      security:
      - oauth2:
        - offline_access
      - api_key: []
      parameters:
      - name: filter
        in: query
        description: 'Filters for limiting the results.

          '
        required: false
        schema:
          type: object
          properties:
            board_id:
              description: Retrieve board objects by the associated board ID.
              type: string
              format: uuid
            board_object_collection_id:
              description: 'Retrieve board objects by the associated board object collection IDs.

                Providing `null` for this parameter will return uncategorized resources.

                '
              type:
              - string
              - 'null'
              format: uuid
            moment_id:
              description: Retrieve board objects by the associated moment ID.
              type: string
              format: uuid
            workspace_id:
              type: array
              description: 'The IDs of the workspaces to which results should be filtered.

                Comma separated list of IDs. If included, will only fetch resources associated with these workspaces. If not included, will return resources associated with all workspaces that the user belongs to. For example, `filter[workspace_id]=798ac6d9-b3fc-4155-88ee-237f43f3404b` will fetch all resources associated with workspace `798ac6d9-b3fc-4155-88ee-237f43f3404b`, while `filter[workspace_id]=798ac6d9-b3fc-4155-88ee-237f43f3404b,d79e513e-9246-454e-80bf-8268bc39cd6e,f2b19a4a-ba0c-49be-8aa7-a1bf68a4a4ed` will fetch any resources associated with workspaces `798ac6d9-b3fc-4155-88ee-237f43f3404b`, `d79e513e-9246-454e-80bf-8268bc39cd6e`, or `f2b19a4a-ba0c-49be-8aa7-a1bf68a4a4ed`.

                '
              items:
                type: string
                format: uuid
        style: deepObject
        explode: true
      - name: include
        in: query
        required: false
        description: A comma separated value of related objects to include.
        schema:
          type: array
          items:
            type: string
            enum:
            - moment
            - moment.assignees
            - moment.channels
            - moment.channels.asset_reference
            - moment.moment_assignees
            - moment.moment_custom_fields
            - moment.note
            - moment.owner
            - moment.planning_status
            - moment.primary_asset_reference
            - moment.schedules
            - moment.stories
            - moment.workspace
            - rich_text_document
        style: form
        explode: false
      - name: fields
        in: query
        description: 'A JSON:API [sparse fieldset](https://jsonapi.org/format/#fetching-sparse-fieldsets) declaration. The resource type can be that of the primary resource (i.e. `board_object`) or any of the included resources (e.g. `moment` or `story`).

          '
        required: false
        schema:
          type: object
          properties:
            asset_reference:
              type: string
            board_object:
              type: string
            moment_assignee:
              type: string
            moment_custom_field:
              type: string
            moment_schedule:
              type: string
            moment:
              type: string
            note:
              type: string
            planning_status:
              type: string
            rich_text_document:
              type: string
            story:
              type: string
            user:
              type: string
            workspace:
              type: string
        style: deepObject
        explode: true
      - name: expose
        in: query
        required: false
        description: Expose response data that is only provided by request.
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            moment:
              type: object
              properties:
                meta:
                  type:
                  - string
                  - 'null'
                  description: 'Use this parameter as: `?expose[moment][meta]&include=moment`


                    Exposing the metadata on each moment resource populates the `meta` key with calculated attributes.

                    If metadata is not exposed, the `meta` key will be an empty object. Detailed documentation on each

                    metadata attribute is available in the [response schema documentation for moments](v3#tag/Moments/operation/ReadMomentsV3).

                    '
      - name: page
        description: Specify an offset and limit for pagination
        in: query
        required: false
        schema:
          type: object
          properties:
            limit:
              type: integer
              default: 50
            offset:
              type: integer
        style: deepObject
        explode: true
