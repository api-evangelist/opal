                                        type: string
                                        nullable: true
                                  - required:
                                    - name
                                    properties:
                                      name:
                                        nullable: false
                                        type: string
                              users_select:
                                type: object
                                description: Tracks the users and groups selected for each usersSelect.
                                  Only present if there's a smart swimlane filter for at least one usersSelect
                                  (People) field.
                                additionalProperties:
