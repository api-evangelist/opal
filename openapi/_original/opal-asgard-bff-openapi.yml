  /{workspace_id}/blocks:
    get:
      tags:
      - Blocks
      operationId: ReadBlocksBFFV1
      summary: Get a collection of Blocks.
      security:
      - oauth2:
        - offline_access
      - api_key:
        - Session-Token
      parameters:
      - name: workspace_id
        in: path
        required: true
        description: The ID of the Block's workspace.
        schema:
          type: string
          format: uuid
      - name: filter
        in: query
        description: 'Filters for limiting the results.

          '
        required: false
        schema:
          type: object
          properties:
            has_child_view:
              type: boolean
              description: 'Boolean true returns blocks with child views, while boolean false returns
                blocks without child views. Omission will return all blocks.

                '
            is_nested:
              type: boolean
              description: 'Boolean true returns nested blocks, while boolean false returns top-level
                blocks. Omission will return all blocks.

                '
            browsable:
              type: boolean
              description: 'Boolean true returns browsable blocks, while boolean false returns non-browsable
                blocks. Omission will return all blocks.

                The concept of browsability determines if a block is eligible for dispaly in directory
                views (like the Plans Directory). Frontend logic should use this property instead of whether
                a block is nested to determine if that block should be shown in the Plans Directory.

                '
            is_template:
              type: boolean
              description: When `false` or omitted only returns blocks. When `true` only returns block
                templates.
              default: false
            is_workspace_wide_template:
              type: boolean
              description: 'When `true` only returns workspace-wide templates.

                MUST be used together with `is_template=true`.'
              default: false
            plan_id:
              type: string
              format: uuid
              description: Limits results to a single plan
        style: deepObject
        explode: true
      responses:
        '200':
          description: The requested blocks
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - category_type
                      - created_at
                      - description
                      - effective_privacy
                      - id
