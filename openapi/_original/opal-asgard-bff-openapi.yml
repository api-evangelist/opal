  /{workspace_id}/in_market/calendar:
    get:
      tags:
      - In Market
      operationId: ReadInMarketBFFV1
      summary: Get in-market calendar view.
      description: 'Returns a collection of in-market Content items such that the content is currently
        live or scheduled to go live across a given set of filter criteria.

        '
      security:
      - oauth2:
        - offline_access
      - api_key:
        - Session-Token
      parameters:
      - name: workspace_id
        in: path
        required: true
        description: The ID of the current workspace to pull content from.
        schema:
          type: string
          format: uuid
      - name: filter
        in: query
        description: 'Filters for limiting the results. All filter parameters are optional except workspace_id
          (provided in path).

          '
        required: false
        schema:
          type: object
          properties:
            account_id:
              type: array
              items:
                type: string
                format: uuid
              description: 'Filter content by comma-separated UUIDs. Matches content having the specified
                account UUID(s).

                '
            channel_id:
              type: array
              items:
                type: string
                format: uuid
              description: 'Filter content by comma-separated UUIDs. Matches content having the specified
                channel UUID(s).

                '
            label_id:
              type: array
              items:
                type: string
                format: uuid
              description: 'Filter by comma-separated UUIDs. Matches content with labels from directly
                assigned labels, or labels inherited from parent moment, story, or account.

                '
            label_set_id:
              type: string
              format: uuid
              description: 'Filter by comma-separated UUIDs. Matches content with labels belonging to
                the specified label set, from directly assigned labels or labels inherited from parent
                moment, story, or account.

                '
            content_statuses:
              type: array
              items:
                type: string
                enum:
                - draft
                - for_approval
                - needs_revision
                - approved
                - idea
              description: 'Filter by comma-separated content workflow statuses. The "idea" status represents
                moments without any content/posts and will return an empty result when used alone, or
                will be stripped from the filter when combined with other statuses.

                '
            scheduled_at:
              allOf:
              - type: object
                properties:
                  eq:
                    type: string
                    description: 'Equal to filter. If no other filter is specified, `eq` will be assumed.

                      '
                  gt:
                    type: string
                    description: Greater than filter
                  gteq:
                    type: string
                    description: Greater than or equal to filter
                  lt:
                    type: string
                    description: Less than filter
                  lteq:
                    type: string
                    description: Less than or equal to filter
              description: 'Filter for content that is live/in-market during the specified time period
                (ISO 8601 format). Supports comparison operators: `eq` (equal to), `gt` (greater than),
                `gteq` (greater than or equal to), lt (less than), `lteq` (less than or equal to).

                If no operator is specified, `eq` is assumed. For example, `filter[scheduled_at]=2025-01-01`
                is equivalent to `filter[scheduled_at][eq]=2025-01-01`.

                The `eq` operator converts a date to a 24-hour range. For example, `filter[scheduled_at][eq]=2025-01-01`
                is equivalent to `filter[scheduled_at][gteq]=2025-01-01T00:00:00&filter[scheduled_at][lteq]=2025-01-02T00:00:00`.

                Use `gteq` for range start and `lteq` for range end to query content scheduled within
                a date range.

                This endpoint always considers both start and takedown dates when filtering by date range,
                returning content that is live during the specified period.

                '
        style: deepObject
        explode: true
      responses:
        '200':
          description: The requested in-market content items
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - content
                    additionalProperties: false
                    description: 'A collection of in-market Content items. Each item contains data from
                      the Content resource and its related resources.

                      '
                    properties:
                      content:
                        type: object
                        required:
                        - by_id
                        - list
                        additionalProperties: false
                        properties:
                          by_id:
                            type: object
                            description: 'An object where the keys are content UUIDs and values are InMarketItem
                              objects. Keys have no guaranteed order.

                              '
                            additionalProperties:
                              type: object
                              required:
                              - id
                              - dateRangeLabel
                              - endDate
                              - momentName
                              - contentSnapshotUrl
                              - contentName
                              - contentUrl
                              - channelSystemName
                              - channelIcon
                              - startDate
                              - storyName
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                  description: The UUID of the content resource.
                                dateRangeLabel:
                                  type: string
                                  nullable: true
                                  description: 'Human-readable date range label (e.g., "Oct 1" if only
                                    a start date, "Oct 24 - Oct 31" if both start and end dates). Derived
                                    from the content''s scheduled_at and takedown_scheduled_at attributes.

                                    '
                                endDate:
                                  type: string
                                  format: date
                                  nullable: true
                                  description: 'The date portion (YYYY-MM-DD) of the scheduled end date/time
                                    for the content (when it will be taken down). Null if no takedown
                                    is scheduled. Derived from the content''s takedown_scheduled_at attribute,
                                    which may reflect the moment''s end date if the moment is configured
                                    to cascade its end date to content. Null if the content has no explicit
                                    takedown date and the moment either has no end date or is not configured
                                    to cascade.

                                    '
                                momentName:
                                  type: string
                                  description: The title/name of the associated moment. Empty string if
                                    no moment.
                                storyName:
                                  type: string
                                  nullable: true
                                  description: The name of the associated story. Null if no story.
                                contentSnapshotUrl:
                                  type: string
                                  nullable: true
                                  description: URL to the default snapshot/preview image for the content.
                                    Null if no snapshot available.
                                contentName:
                                  type: string
                                  description: The name/title of the content.
                                contentUrl:
                                  type: string
                                  nullable: true
                                  description: 'Relative URL path to the content in format: moments/{workspace_slug}/{moment_legacy_id}/posts/{post_legacy_id}.
                                    Null if any required component is missing.

                                    '
                                channelSystemName:
                                  type: string
                                  nullable: true
                                  description: 'The system name of the social media channel (e.g., "facebook",
                                    "instagram", "twitter"). Null if no channel associated.

                                    '
                                channelIcon:
                                  type: string
                                  nullable: true
                                startDate:
                                  type: string
                                  format: date
                                  nullable: true
                                  description: 'The date portion (YYYY-MM-DD) of the scheduled start date/time
                                    for the content (when it goes live). Null if no schedule is set.

                                    '
                          list:
                            type: array
                            description: 'An ordered array of Content UUIDs providing the display order
                              for items, and is sorted by the Content''s scheduled start date/time (ascending,
                              null values first), then contentName (alphabetical). Look up items in `by_id`
                              using the UUIDs from this list.

                              '
                            items:
                              type: string
                              format: uuid
              example:
                data:
                  content:
                    by_id:
                      bf886a14-6fdf-4c5a-95d5-6d2574ef2d06:
                        id: bf886a14-6fdf-4c5a-95d5-6d2574ef2d06
                        dateRangeLabel: Oct 24 - Oct 31
                        endDate: '2025-10-31'
                        momentName: Product Launch Campaign
                        contentSnapshotUrl: https://foo.opal.com:443/api/v1/snapshots/bf886a14-6fdf-4c5a-95d5-6d2574ef2d06
                        contentName: New Product Announcement
                        contentUrl: moments/acme-corp/13/posts/13
                        channelSystemName: facebook
                        channelIcon: facebook
                        startDate: '2025-10-24'
                        storyName: Social Media Push
                      c8997b25-7ee0-5d6b-a6e6-7e3685fa3e17:
                        id: c8997b25-7ee0-5d6b-a6e6-7e3685fa3e17
                        dateRangeLabel: Oct 25
