  /{workspace_id}/smart_blocks:
    get:
      tags:
      - Smart Blocks
      operationId: ReadSmartBlocksBFFV1
      summary: Get a collection of blocks.
      security:
      - oauth2:
        - offline_access
      - api_key:
        - Session-Token
      parameters:
      - name: workspace_id
        in: path
        required: true
        description: The ID of the current workspace to pull blocks from.
        schema:
          type: string
          format: uuid
      - name: filter
        in: query
        description: 'Filters for limiting the results.

          '
        required: true
        schema:
          type: object
          properties:
            plan_ids:
              type: array
              description: 'A comma separated list of Plan Ids.

                If provided, only blocks from these plans will be returned.

                '
              items:
                type: string
                format: uuid
            grandparent_plan_ids:
              type: array
              description: 'A list of plan ids to aggregate sub-plan blocks from. e.g. a plan in this
                list will not return its directly associated blocks, but instead all of the blocks found
                on the sub-plans of its directly associated blocks.

                '
              items:
                type: string
                format: uuid
            type_ids:
              type: array
              description: 'A comma-separated list of type ids (also known as `category_type`) to filter
                down the collection of blocks.

                '
              items:
                type: string
                format: uuid
            start_at:
              description: 'Filter by the block’s scheduled `start_at` date. Supports the `gteq` (greater
                than or equal to) and `lteq` (less than or equal to) operators, e.g. `filter[start_at][lteq]=2026-07-31`,
                with `YYYY-MM-DD` values.

                Blocks without a `start_at` are never returned when this filter is set (a null date satisfies
                no comparison).'
              type: object
              additionalProperties: false
              properties:
                gteq:
                  type: string
                  format: date
                lteq:
                  type: string
                  format: date
            end_at:
              description: 'Filter by the block’s derived active-period end date. A block’s active period
                runs from its `start_at` to its effective end date — `start_at` plus `duration`, or `start_at`
                for blocks with no `duration`. `end_at` is not a stored attribute; it is computed for
                comparison purposes.

                Supports the `gteq` (greater than or equal to) and `lteq` (less than or equal to) operators,
                e.g. `filter[end_at][gteq]=2026-07-01`, with `YYYY-MM-DD` values.

                Combine `filter[end_at][gteq]` with `filter[start_at][lteq]` to return only blocks whose
                active period intersects a window (e.g. “what is happening in July?”). Blocks without
                a `start_at` are never returned when this filter is set (a null date satisfies no comparison).'
              type: object
              additionalProperties: false
              properties:
                gteq:
                  type: string
                  format: date
                lteq:
                  type: string
                  format: date
            custom_fields:
              description: 'An object keyed by custom field ids.

                For singleSelect and multiSelect fields the value is an array of custom field option ids.
                For usersSelect (People) fields the value is an object with `user_ids` and `group_ids`
                arrays.

                Acts as an inclusive filter within a field and exclusive across fields. In other words,
                blocks must match on at least one selected value for every custom field in the filter.'
              type: object
              additionalProperties:
                oneOf:
                - type: array
                  items:
                    type: string
                    format: uuid
                - type: object
                  additionalProperties: false
                  required:
                  - user_ids
                  - group_ids
                  properties:
                    user_ids:
                      type: array
                      items:
                        type: string
                        format: uuid
                    group_ids:
                      type: array
                      items:
                        type: string
                        format: uuid
        style: deepObject
        explode: true
      - name: group_by
        in: query
        description: 'Controls the grouping of the returned blocks. One of the `group_by` parameters is
          required for this endpoint.

          '
        required: true
        schema:
          type: object
          required:
          - strategy
          properties:
            custom_field_id:
              type: string
              nullable: true
              format: uuid
              description: 'ID of a custom field. Must be a "Single Select" or "Multi Select" custom field
                type.

                When using a custom field for grouping, the blocks will be collected by the options defined
                on that field as they are set on the block. That is - blocks with an option or options
                set for this field will be collected in a group for that option''s name. In the case of
                a "Multi Select" custom field, a block with multiple options selected will appear in multiple
                collections.

                Blocks without any relevant options selected for the given field will be collected under
                a "no_value" collection.

                '
            strategy:
              type: string
              enum:
              - category_type
              - custom_field
              description: 'Strategy used to group blocks. If set to `category_type`, the blocks will
                be organized according to their category_type relationship.

                If set to `custom_field`, then the `group_by[custom_field_id]` should have a custom_field''s
                `id` set to indicate which custom field the blocks should be grouped by.

                '
            exclude_empty_groupings:
              type: boolean
              default: true
              description: 'Dictates whether to return data for group_by fields that do not have any corresponding
                blocks. These empty fields will be excluded by default and will only be returned when
                this value is set to false.

                '
        style: deepObject
        explode: true
      responses:
        '200':
          description: The requested blocks
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - datasource
                    - categories
                    - blocks
                    additionalProperties: false
                    properties:
