                        additionalProperties: false
                        properties:
                          filter_set_id:
                            type: string
                            format: uuid
                          filter:
                            type: object
                            description: 'The filter setting of the returned collection.

                              '
                            additionalProperties: false
                            properties:
                              custom_field_options:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - id
                                  - name
                                  additionalProperties: false
                                  properties:
                                    id:
                                      type: string
                                      format: uuid
                                    name:
                                      type: string
                                      nullable: true
                              plans:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - id
                                  - name
                                  additionalProperties: false
                                  properties:
                                    id:
                                      type: string
                                      format: uuid
                                    name:
                                      type: string
