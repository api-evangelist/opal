      operationId: ExperimentalReadBlockBFFV1
      description: Experimental endpoint to get a Block, assuming block/plan rearchitecture.
      summary: Get a Block.
      security:
      - oauth2:
        - offline_access
      - api_key:
        - Session-Token
      parameters:
      - name: workspace_id
        in: path
        required: true
        description: The ID of the Block's workspace.
        schema:
          type: string
          format: uuid
      - name: block_id
        in: path
        required: true
        description: The ID of the Block.
        schema:
          type: string
          format: uuid
      responses:
