  /{workspace_id}/smart_categories/{smart_category_id}/smart_blocks:
    get:
      tags:
      - Smart Blocks
      operationId: ReadSmartCategorySmartBlocksBFFV1
      summary: Get a collection of blocks for a saved Smart Swimlane.
      security:
      - oauth2:
        - offline_access
      - api_key:
        - Session-Token
      parameters:
      - name: workspace_id
        in: path
        required: true
        description: The ID of the current workspace to pull blocks from.
        schema:
          type: string
          format: uuid
      - name: smart_category_id
        in: path
        required: true
        description: 'The ID of the smart swimlane to pull the filtering and grouping configuration from.
          Note that this category must have configured filter_set and group_by fields to be valid.

          '
        schema:
          type: string
          format: uuid
      - name: filter
        in: query
        required: false
        schema:
          type: object
          additionalProperties: false
          properties:
            start_at:
              description: 'Filter by the blocks’ scheduled `start_at` date. Supports the `gteq` (greater
                than or equal to) and `lteq` (less than or equal to) operators, e.g. `filter[start_at][lteq]=2026-07-31`,
                with `YYYY-MM-DD` values.

                Blocks without a `start_at` are never returned when this filter is set (a null date satisfies
                no comparison).'
              type: object
              additionalProperties: false
              properties:
                gteq:
                  type: string
                  format: date
                lteq:
                  type: string
                  format: date
            end_at:
              description: 'Filter by block’s derived active-period end date. A block’s active period
                runs from its `start_at` to its effective end date — `start_at` plus `duration`, or `start_at`
                for blocks with no `duration`. `end_at` is not a stored attribute; it is computed for
                comparison purposes.

                Supports the `gteq` (greater than or equal to) and `lteq` (less than or equal to) operators,
                e.g. `filter[end_at][gteq]=2026-07-01`, with `YYYY-MM-DD` values.

                Combine `filter[end_at][gteq]` with `filter[start_at][lteq]` to return only blocks whose
                active period intersects a window (e.g. “what is happening in July?”). Blocks without
                a `start_at` are never returned when this filter is set (a null date satisfies no comparison).'
              type: object
              additionalProperties: false
              properties:
                gteq:
                  type: string
                  format: date
                lteq:
                  type: string
                  format: date
