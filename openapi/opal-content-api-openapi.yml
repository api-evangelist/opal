  /content/v3:
    get:
      tags:
      - Content
      operationId: ReadContentsV3
      summary: '[UNSTABLE] Return all content available to the authenticated user.'
      security:
      - oauth2:
        - offline_access
      - api_key: []
      parameters:
      - name: filter
        in: query
        description: 'Filters for limiting the results.

          '
        required: false
        schema:
          type: object
          properties:
            workspace_id:
              type: array
              description: 'The IDs of the workspaces to which results should be filtered.

                Comma separated list of IDs. If included, will only fetch resources associated with these workspaces. If not included, will return resources associated with all workspaces that the user belongs to. For example, `filter[workspace_id]=798ac6d9-b3fc-4155-88ee-237f43f3404b` will fetch all resources associated with workspace `798ac6d9-b3fc-4155-88ee-237f43f3404b`, while `filter[workspace_id]=798ac6d9-b3fc-4155-88ee-237f43f3404b,d79e513e-9246-454e-80bf-8268bc39cd6e,f2b19a4a-ba0c-49be-8aa7-a1bf68a4a4ed` will fetch any resources associated with workspaces `798ac6d9-b3fc-4155-88ee-237f43f3404b`, `d79e513e-9246-454e-80bf-8268bc39cd6e`, or `f2b19a4a-ba0c-49be-8aa7-a1bf68a4a4ed`.

                '
              items:
                type: string
                format: uuid
            account_id:
              type: array
              description: 'Filter content by account UUID(s). Comma-separated for multiple values.

                '
              items:
                type: string
                format: uuid
            channel_id:
              type: array
              description: 'Filter content by channel UUID(s). Comma-separated for multiple values.

                '
              items:
                type: string
                format: uuid
            label_id:
              type: array
              description: 'Filter content by label UUID(s). Comma-separated for multiple values. Matches content with labels from any source: directly assigned labels, or labels inherited from parent moment, story, or account.

                '
              items:
                type: string
                format: uuid
            label_set_id:
              type: array
              description: 'Filter content by label set UUID(s). Comma-separated for multiple values.

                '
              items:
                type: string
                format: uuid
            moment_id:
              type: array
              description: 'Filter content by moment UUID(s). Comma-separated for multiple values.

                '
              items:
                type: string
                format: uuid
            story_id:
              type: array
              description: 'Filter content by story UUID(s). Comma-separated for multiple values.

                '
              items:
                type: string
                format: uuid
            calendar_filter:
              type: string
              description: "A serialized JSON object representing filter criteria for alternative filtering requirements, focused on source (channels/accounts), status, and label filtering. This allows using inclusive (OR) logic within filter types and exclusive (AND) logic across filter types.\nFor date/schedule filtering, use the separate `scheduled_at` and `include_overlapping_schedules` filter parameters (not part of calendar_filter).\nEach item in the filter object is optional.\n```json\n{\n  \"channel_ids\": [\"uuid\"],\n  \"account_ids\": [\"uuid\"],\n  \"post_statuses\": [\"draft|for_approval|needs_revision|approved|idea\"],\n  \"label_ids\": [\"uuid\"]\n}\n```\nFilter Logic:\n- Channel IDs and account IDs use OR logic since they are the same filter type (sources).\n  When both are provided, all UUIDs from both arrays are combined with OR logic.\n\n- Post statuses use OR logic within the array\n- Label IDs use OR logic across all provided labels, regardless of which label set they belong to\n- All different filter types (sources, statuses, labels) are combined with AND logic\n"
            post_statuses:
              type: array
              description: 'Filter content by status value(s). Comma-separated for multiple values.

                '
              items:
                type: string
                enum:
                - draft
                - for_approval
                - needs_revision
                - approved
            scheduled_at:
              allOf:
              - type: object
                properties:
                  eq:
                    type: string
                    description: 'Equal to filter. If no other filter is specified, `eq` will be assumed.

                      '
                  gt:
                    type: string
                    description: Greater than filter
                  gteq:
                    type: string
                    description: Greater than or equal to filter
                  lt:
                    type: string
                    description: Less than filter
                  lteq:
                    type: string
                    description: Less than or equal to filter
              - description: 'Filter content by effective start date using comparison operators (ISO 8601 date-time format). Accepts `YYYY-MM-DD` (date) or `YYYY-MM-DDThh:mm:ssTZD` (datetime) formats. Date-only values are converted to day boundaries in the America/Los_Angeles timezone: beginning-of-day (00:00:00) for `gteq`/`gt`, end-of-day (23:59:59) for `lteq`/`lt`. Matches content''s effective schedule (explicitly set or inherited from parent moment). By default, filters by start date only. To find content live during a date range (considering both start and takedown dates), use include_overlapping_schedules=true.

                  '
            include_overlapping_schedules:
              type: boolean
              description: 'When true and used with scheduled_at, finds content that is live (published) during the specified date range by considering both start and takedown dates. When false or omitted, filters by start date only. Example: filter[scheduled_at][gteq]=2025-10-01&filter[scheduled_at][lteq]=2025-10-31&filter[include_overlapping_schedules]=true

                '
        style: deepObject
        explode: true
      - name: include
        in: query
        required: false
        description: A comma separated value of related objects to include.
        schema:
          type: array
          items:
            type: string
            enum:
            - account
            - asset_references
            - channel
            - label_sets
            - labels
            - moment
            - note
            - stories
            - user
            - workspace
        style: form
        explode: false
      - name: expose
        in: query
        required: false
        description: "Optionally calculated content metadata which are not part of responses by default.\n\nYou request that metadata be included in responses with the `expose` query\nparameter like: `?expose[content][meta]` or more granularly \n`?expose[content][meta]=effective_privacy`.\n"
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties: false
          properties:
            content:
              type: object
              properties:
                meta:
                  type:
                  - string
                  - 'null'
                  description: 'Exposing the metadata on each content resource populates the

                    `meta` key with calculated attributes. If metadata is not

                    exposed, the `meta` key will be an empty object. Detailed

                    documentation on each metadata attribute is available in the

                    response schema documentation.


                    Note that if you expose the effective_privacy content

                    metadata then all content in the response must belong to the

                    same workspace. In this case, you are required to use the

                    `filter[workspace_id]` query parameter with a single

                    workspace ID.

                    '
      - name: page
        description: Specify an offset and limit for pagination
        in: query
        required: false
        schema:
          type: object
          properties:
            limit:
              type: integer
              default: 50
            offset:
              type: integer
        style: deepObject
        explode: true
      responses:
        '200':
          description: A collection of content.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      title: content
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      - relationships
                      - links
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          enum:
                          - content
                        meta:
                          type:
                          - object
                          - 'null'
                          description: 'Optionally calculated content metadata which are not part of responses by default.

                            '
                          additionalProperties: false
                          properties:
                            effective_privacy:
                              type: string
                              enum:
                              - whole_workspace
                              - some_but_not_all
                              description: 'The effective privacy of a resource is calculated based on all direct and

                                inherited access. If a resource or any of its parents that it inherits

                                access from are accessible to the entire workspace, the effective privacy

                                is `whole_workspace`. Otherwise, the effective privacy is

                                `some_but_not_all`.

                                '
                        attributes:
