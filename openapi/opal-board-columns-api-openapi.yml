- url: https://login.ouropal.com
tags:
- name: Board Columns
paths:
  /boards/v3/{board_id}/board_columns:
    get:
      tags:
      - Board Columns
      operationId: ReadBoardColumnsV3
      summary: Get Board Columns available to the authenticated user and Board.
      security:
      - oauth2:
        - offline_access
      - api_key: []
      parameters:
      - name: board_id
        in: path
        required: true
        description: The ID of the Board.
        schema:
          type: string
          format: uuid
      - name: include
        in: query
        required: false
        description: A comma separated value of related objects to include.
        schema:
          type: array
          items:
            type: string
            enum:
            - board
            - board_standard_column
            - custom_field
            - custom_field_type
        style: form
        explode: false
      - name: page
        description: Specify an offset and limit for pagination
        in: query
        required: false
        schema:
          type: object
          properties:
            limit:
              type: integer
              default: 50
            offset:
              type: integer
        style: deepObject
        explode: true
      responses:
        '200':
          description: A collection of Board Columns.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      title: board_column
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      - relationships
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          enum:
