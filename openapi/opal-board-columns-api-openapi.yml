                          properties:
                            position:
                              type: integer
                              description: "An integer indicating the zero-based ordinal position of this \nboard column relative to other board columns.\n"
                            is_enabled:
                              type: boolean
                              description: 'A value indicating whether this column is to be displayed in the UI

                                when viewing the given board.

                                '
                            created_at:
                              type: string
                              format: date-time
                              description: An ISO8601 date-time representing the entity's creation date-time.
                              readOnly: true
                            updated_at:
                              type: string
                              format: date-time
                              description: An ISO8601 date-time representing the entity's most recent updated date-time.
                              readOnly: true
                        relationships:
