                                  displayed in other views, depending on the user’s filter

                                  settings.

                                  '
                              title:
                                type: string
                                description: The name of the board.
                              updated_at:
                                type:
                                - string
                                - 'null'
                                format: date-time
                                description: An ISO8601 date-time.
                                readOnly: true
                          relationships:
                            type: object
                            additionalProperties: false
                            required:
