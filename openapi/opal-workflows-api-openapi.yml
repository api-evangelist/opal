    post:
      tags:
      - Workflows
      operationId: CreateWorkflowsV2
      summary: Create a workflow
      description: 'This endpoint creates a workflow without a context.


        Before being used by an end-user of the Opal Platform,

        the workflow will need to be put in the context of a

        StoryFirst resource (like a moment) using the

        `/workflows/v2/contexts` endpoint.


        If you use the `template` parameter to create a workflow

        that is pre-populated with stages & assignments, you may also

        want to use the `include` parameter to include `stages` and

        `stages.assignment` in the response.

        '
      security:
      - oauth2:
        - offline_access
      - api_key:
        - Session-Token
      parameters:
      - name: template
        in: query
        required: false
        description: 'Optionally create a workflow with a template.


          Using templates creates a few workflow resources with one request.

          You cannot use multiple templates at once.


          The "approval" template creates a circuit breaker followed by

          an approval stage. Both contain one unassigned assignment.


          The "task" template creates a circuit breaker followed by

          a task stage. Both contain one unassigned assignment.

          '
        schema:
          type: string
          enum:
          - approval
          - task
        style: form
      - name: include
        in: query
        required: false
        description: A comma separated value of related objects to include.
        schema:
          type: array
          items:
            type: string
            enum:
            - context
            - stages
            - stages.assignments
            - stages.assignments.responses
        style: form
        explode: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - type
                  properties:
                    type:
                      type: string
                      enum:
                      - workflow
                    attributes:
                      type: object
                      properties:
                        lock_inherited_phases:
                          type: boolean
            example:
              data:
                type: workflow
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    title: workflow
                    type: object
                    required:
                    - id
                    - attributes
                    - relationships
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        format: uuid
                      type:
                        type: string
                        enum:
                        - workflow
                      meta:
                        type: object
                        description: "Optionally calculated workflow status metadata. **Not part of responses by default.**\n\nThis is currently only available when requesting workflow resources from the\n`/workflows/v2/workflows` and `/workflows/v2/workflows/{id}` `GET` endpoints.\nYou request that this metadata be included in responses with the `expose` query \nparameter like: `/workflows/v2/workflows?expose[workflow][meta]`.\n\nThe \"latest active stage\" is either the stage that is currently active or it is the\nlast stage of a completed workflow.\n"
                        required:
                        - latest_active_stage
                        - completed_stages
                        - stage_type_count
                        additionalProperties: false
                        properties:
                          latest_active_stage:
                            oneOf:
                            - title: Stage Status Metadata
                              allOf:
                              - required:
                                - stage_type
                                - resource_identifier
                                properties:
                                  stage_type:
                                    type: string
                                    enum:
                                    - approval
                                    - task
                                    - circuit_breaker
                                  title:
                                    type:
                                    - string
                                    - 'null'
                                    description: The title of the stage.
                                  due_date:
                                    type:
                                    - string
                                    - 'null'
                                    format: date-time
                                    description: The due date of the stage if set.
                                  resource_identifier:
                                    type: object
                                    required:
                                    - data
                                    additionalProperties: false
                                    properties:
                                      data:
                                        type: object
                                        required:
                                        - id
                                        - type
                                        additionalProperties: false
                                        properties:
                                          id:
                                            type: string
                                          type:
                                            type: string
                                            enum:
                                            - stage
                              - type: object
                                description: The status metadata of a stage.
                                required:
                                - assignment_counts
                                properties:
                                  assignment_counts:
                                    type: object
                                    description: "Assignment counts broken down in three ways.\n\nFirst, the number of complete/incomplete assignments for\nall users (both approvals and tasks).\n\nSecond, the number of complete/incomplete assignments for\nthe current user (both approvals and tasks).\n\nThird, the number of declined approvals.\n\nIn the first two cases, both approvals and tasks can be \ncomplete or incomplete where both approved and declined responses\non an approval assignment count as completion.\n"
                                    required:
                                    - all
                                    - current_user
                                    - declined
                                    additionalProperties: false
                                    properties:
                                      all:
                                        type: object
                                        required:
                                        - incomplete
                                        - complete
                                        additionalProperties: false
                                        properties:
                                          incomplete:
                                            type: integer
                                            minimum: 0
                                          complete:
                                            type: integer
                                            minimum: 0
                                      current_user:
