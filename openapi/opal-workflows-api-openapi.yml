  /workflows/v2/assignments:
    get:
      tags:
      - Workflows
      operationId: ReadAssignmentsV2
      summary: Get a collection of assignments
      description: 'Get assignments to which the authenticated user has access.

        These are not necessarily assignments assigned to the requesting user; if you wish to get assignments that are assigned to the user making the API request, pass the `assigned_user_id` filter set to the current user''s ID.

        If you do not specify a pagination limit, a default page limit of 150 assignments will be used.

        '
      security:
      - oauth2:
        - offline_access
      - api_key:
        - Session-Token
      parameters:
      - name: filter
        in: query
        description: Filter the resulting assignments.
        required: false
        schema:
          type: object
          properties:
            activated_at:
              allOf:
              - type: object
                properties:
                  eq:
                    type: string
                    description: 'Equal to filter. If no other filter is specified, `eq` will be assumed.

                      '
                  gt:
                    type: string
                    description: Greater than filter
                  gteq:
                    type: string
                    description: Greater than or equal to filter
                  lt:
                    type: string
                    description: Less than filter
                  lteq:
                    type: string
                    description: Less than or equal to filter
              - format: date-time
              - description: 'Filter assignments by when the stage transitioned to an "active" status. Uses syntax `filter[activated_at][gt]=2020-01-01T00:00:00-07:00`.


                  You can filter to a particular day by omitting the `gt`/`lt`/etc.: `filter[activated_at]=2020-01-01`.

                  '
            assigned_user_id:
              type: array
              items:
                type: integer
              description: The ID(s) of the users to which assignments are given.
            assignment_type:
              type: array
              items:
                type: string
                enum:
                - approval
                - task
                - circuit_breaker
                - none
              description: The types of assignments to retrieve.
            brand_id:
              type: array
              description: 'The IDs of the workspaces to which results should be filtered.

                "Workspace ID" and "Brand ID" are synonymous.

                Comma separated list of IDs. If included, will only fetch resources associated with these brands. If not included, will return resources associated with all brands that the user belongs to. For example, `filter[brand_id]=1` will fetch all resources associated with brand 1, while `filter[brand_id]=1,2,3` will fetch any resources associated with brands 1, 2, or 3.

                '
              items:
                type: integer
            created_at:
              allOf:
              - type: object
                properties:
                  eq:
                    type: string
                    description: 'Equal to filter. If no other filter is specified, `eq` will be assumed.

                      '
                  gt:
                    type: string
                    description: Greater than filter
                  gteq:
                    type: string
                    description: Greater than or equal to filter
                  lt:
                    type: string
                    description: Less than filter
                  lteq:
                    type: string
                    description: Less than or equal to filter
              - format: date-time
              - description: 'Filter assignments by when they were created. Uses syntax `filter[created_at][gt]=2020-01-01T00:00:00-07:00`.


                  You can filter to a particular day by omitting the `gt`/`lt`/etc.: `filter[created_at]=2020-01-01`.

                  '
            created_by_user_id:
              type: array
              items:
                type: integer
              description: The ID(s) of the users that created the assignment.
            due_date:
              allOf:
              - type: object
                properties:
                  eq:
                    type: string
                    description: 'Equal to filter. If no other filter is specified, `eq` will be assumed.

                      '
                  gt:
                    type: string
                    description: Greater than filter
                  gteq:
                    type: string
                    description: Greater than or equal to filter
                  lt:
                    type: string
                    description: Less than filter
                  lteq:
                    type: string
                    description: Less than or equal to filter
              - format: date-time
              - description: 'Filter assignments by when they are due. Uses syntax `filter[due_date][gt]=2020-01-01T00:00:00-07:00`


                  You can filter to a particular day by omitting the `gt`/`lt`/etc.: `filter[due_date]=2020-01-01`.


                  You can filter to only assignments without a set due date by ommiting the `gt`/`lt`/etc. and filtering for null: `filter[due_date]=null`.


                  Assignment due date is based on the stage containing the assignment. See Stage resource metadata.

                  '
            status:
              type: array
              items:
                type: string
                enum:
                - complete
                - incomplete
              description: 'The status of the assignment. This is dictated by the responses (if any) to this assignment.

                Note that an incomplete assignment _can_ exist within a completed stage if the criteria for completing the stage was met without all assignments in the stage having been completed.

                '
            stage_status:
              type: array
              items:
                type: string
                enum:
                - inactive
                - active
                - complete
              description: 'The status of the stage containing this assignment.

                Note that an incomplete assignment _can_ exist within a completed stage if the criteria for completing the stage was met without all assignments in the stage having been completed.

                '
        style: deepObject
        explode: true
      - name: include
        in: query
        required: false
        description: 'A comma separated value of related resource objects on the assignment to include.

          Note that user resources are not available as includes on this endpoint; the client must make subsequent API requests `api/v1/users` to request additional information on related users.

