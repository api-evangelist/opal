      - oauth2:
        - offline_access
      - api_key: []
      parameters:
      - name: filter
        in: query
        description: 'Filters for limiting the results.

          '
        required: false
        schema:
          type: object
          properties:
            board_id:
              description: Retrieve board collaborators by the associated board ID.
              type: string
              format: uuid
            collaborator_id:
              description: Retrieve board collaborators by the associated collaborator ID.
              type: string
              format: uuid
        style: deepObject
        explode: true
      - name: include
        in: query
        required: false
        description: A comma separated value of related objects to include.
        schema:
          type: array
          items:
            type: string
            enum:
            - board
            - collaborator
            - collaborator_group
            - collaborator_group.asset
            - collaborator.profile
            - collaborator.profile.avatar_asset_reference
        style: form
        explode: false
      responses:
        '200':
          description: A collection of Board Collaborators for private Boards.
