info:
  version: 3.0.0
  title: Opal API (⚠️ WIP) Board Collaborators API
  license:
    name: Opal API License
    url: https://www.workwithopal.com/api-license
  description: The key words “MUST”, “MUST NOT”, “REQUIRED”, “SHALL”, “SHALL NOT”, “SHOULD”, “SHOULD NOT”, “RECOMMENDED”, “NOT RECOMMENDED”, “MAY”, and “OPTIONAL” in this document are to be interpreted as described in BCP 14 [RFC2119] [RFC8174] when, and only when, they appear in all capitals, as shown here.
servers:
- url: https://login.ouropal.com
tags:
- name: Board Collaborators
  description: '## Board Collaborators Overview

    Board Collaborators allow opal users to add other users as a collaborator on their **private** Boards. This allows the Collaborators to view and edit the Board as if they were the owner.


    Because **public** Boards are already available to any user in your Workspace, they do not require Board Collaborators. The endpoints are not available for these public Boards and will return error messages accordingly.'
paths:
  /board_collaborators/v3:
