                      - title: opal
                        type: object
                        required:
                        - id
                        - type
                        - meta
                        - attributes
                        - relationships
                        additionalProperties: false
                        properties:
                          id:
                            type: string
                            pattern: ^[0-9]+$
                          type:
                            type: string
                            enum:
                            - opal
                          meta:
