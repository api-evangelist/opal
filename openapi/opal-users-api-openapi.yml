                                      required:
                                      - id
                                      - type
                                      additionalProperties: false
                                      properties:
                                        id:
                                          type: string
                                        type:
                                          type: string
                                          enum:
                                          - story
                              cover_asset_reference:
                                type: object
                                required:
                                - data
                                additionalProperties: false
                                properties:
                                  data:
                                    type:
                                    - object
                                    - 'null'
                                    required:
                                    - id
                                    - type
                                    additionalProperties: false
                                    properties:
                                      id:
                                        type: string
                                      type:
                                        type: string
                                        enum:
                                        - asset_reference
                              labels:
                                type: object
                                required:
                                - data
                                additionalProperties: false
                                properties:
                                  data:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                      - id
                                      - type
                                      additionalProperties: false
                                      properties:
                                        id:
                                          type: string
                                        type:
                                          type: string
                                          enum:
                                          - label
                              asset_reference_options:
                                type: object
                                required:
                                - data
                                additionalProperties: false
                                properties:
                                  data:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                      - id
                                      - type
                                      additionalProperties: false
                                      properties:
                                        id:
                                          type: string
                                        type:
                                          type: string
                                          enum:
                                          - asset_reference_option
                              options:
                                type: object
                                required:
                                - data
                                additionalProperties: false
                                properties:
                                  data:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                      - id
                                      - type
                                      additionalProperties: false
                                      properties:
                                        id:
                                          type: string
                                        type:
                                          type: string
                                          enum:
                                          - option
                      - title: brand_admin_user
                        type: object
                        required:
                        - id
                        - type
                        - attributes
                        - relationships
                        additionalProperties: false
                        properties:
                          id:
                            type: string
                            pattern: ^[0-9]+$
                          type:
                            type: string
                            enum:
                            - brand_admin_user
                          attributes:
                            type: object
                            additionalProperties: false
                            properties: {}
                          relationships:
                            type: object
                            required:
                            - user
                            - brand
                            additionalProperties: false
                            properties:
                              user:
                                type: object
                                required:
                                - data
                                additionalProperties: false
                                properties:
                                  data:
                                    type: object
                                    required:
                                    - id
                                    - type
                                    additionalProperties: false
                                    properties:
                                      id:
                                        type: string
                                      type:
                                        type: string
                                        enum:
                                        - user
                              brand:
                                type: object
                                required:
                                - data
                                additionalProperties: false
                                properties:
                                  data:
                                    type: object
                                    required:
                                    - id
                                    - type
                                    additionalProperties: false
                                    properties:
                                      id:
                                        type: string
                                      type:
                                        type: string
                                        enum:
                                        - brand
                      - title: brand
                        type: object
                        required:
                        - id
                        - type
                        - attributes
                        - relationships
                        additionalProperties: false
                        properties:
                          id:
                            type: string
                            pattern: ^[0-9]+$
                          type:
                            type: string
                            enum:
                            - brand
                          meta:
                            type:
                            - object
                            - 'null'
                            description: Metadata around the Brand object
                            properties:
                              user_is_member:
                                type: boolean
                                description: Boolean that represents whether the requesting user is a member of the brand.
                          attributes:
                            type: object
                            required:
                            - slug
                            - name
                            - uuid
                            - start_of_week
                            - timezone
                            additionalProperties: false
                            properties:
                              uuid:
                                type: string
                                format: uuid
                                description: A unique identifier for the workspace.
                              created_at:
                                type: string
                                format: date-time
                                description: An ISO8601 date-time.
                                readOnly: true
                              updated_at:
                                type: string
                                format: date-time
                                description: An ISO8601 date-time indicating when the user was last updated.
                                readOnly: true
                              slug:
                                type: string
                                description: The slug for the Brand/Workspace. This is a url-safe name for the Workspace.
                              name:
                                type: string
                                description: The name of the Workspace.
                              start_of_week:
                                type: number
                                enum:
                                - 0
                                - 1
                                - 2
                                - 3
                                - 4
                                - 5
                                - 6
                                description: 'The default start weekday index for the week view Calendar and for Plans. Specifies the days in a week, 0 to 6 (Sunday to Saturday). 0 (Sunday) is the default.

                                  With regards to the week view Calendar, values greater than 1 will be considered the same as 1.'
                              timezone:
                                type: string
                                description: The IANA time zone identifier for the default time zone used when creating resources in the Brand/Workspace (e.g. America/New_York).
                          relationships:
                            type: object
                            required:
                            - primary_label_set
                            - accounts
                            - logo
                            - dispatch_providers
                            additionalProperties: false
                            properties:
                              primary_label_set:
                                type: object
                                required:
                                - data
                                additionalProperties: false
                                properties:
                                  data:
                                    type:
                                    - object
                                    - 'null'
                                    required:
                                    - id
                                    - type
                                    additionalProperties: false
                                    properties:
                                      id:
                                        type: string
                                      type:
                                        type: string
                                        enum:
                                        - label_set
                              accounts:
                                type: object
                                required:
                                - data
                                additionalProperties: false
                                properties:
                                  data:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                      - id
                                      - type
                                      additionalProperties: false
                                      properties:
                                        id:
                                          type: string
                                        type:
                                          type: string
                                          enum:
                                          - account
                              logo:
                                type: object
                                required:
                                - data
                                additionalProperties: false
                                properties:
                                  data:
                                    type:
                                    - object
                                    - 'null'
                                    required:
                                    - id
                                    - type
                                    additionalProperties: false
                                    properties:
                                      id:
                                        type: string
                                      type:
                                        type: string
                                        enum:
                                        - asset_reference
                              dispatch_providers:
                                type: object
                                required:
                                - data
                                additionalProperties: false
                                properties:
                                  data:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                      - id
                                      - type
                                      additionalProperties: false
                                      properties:
                                        id:
                                          type: string
                                        type:
                                          type: string
                                          enum:
                                          - dispatch_provider
                      - title: dispatch_provider_account
                        type: object
                        required:
                        - id
                        - type
                        - attributes
                        additionalProperties: false
                        properties:
                          id:
                            type: string
                            pattern: ^[0-9]+$
                          type:
                            type: string
                            enum:
                            - dispatch_provider
                          attributes:
                            type: object
                            additionalProperties: false
                            required:
                            - display_name
                            - system_name
                            properties:
                              display_name:
                                type: string
                              system_name:
                                type: string
                              created_at:
                                type: string
                                format: date-time
                                description: An ISO8601 date-time.
                                readOnly: true
                              updated_at:
                                type: string
                                format: date-time
                                description: An ISO8601 date-time indicating when the user was last updated.
                                readOnly: true
                      - title: moments_setting
                        type: object
                        required:
                        - id
                        - type
                        - attributes
                        - relationships
                        additionalProperties: false
                        properties:
                          id:
                            type: string
                            pattern: ^[0-9]+$
                          type:
                            type: string
                            enum:
                            - moments_setting
                          attributes:
                            type: object
                            required:
                            - created_at
                            - updated_at
                            - budget_panel_moment_view_collapsed
                            - chat_activity_hub_view_preference
                            - collapsed_sections
                            - content_queue_filters_open
                            - current_brand_id
                            - longform_editor_theme
                            - moment_shroud_card_view
                            - moment_shroud_layout
                            - moments_filters_open
                            - pinned_brand_ids
                            - post_view_modes
                            - stories_filters_open
                            - timeslice_duration
                            additionalProperties: false
                            properties:
                              created_at:
                                type: string
                                format: date-time
                                description: An ISO8601 date-time.
                                readOnly: true
                              updated_at:
                                type: string
                                format: date-time
                                description: An ISO8601 date-time.
                                readOnly: true
                              budget_panel_moment_view_collapsed:
                                type: boolean
                                description: Determines inital collapse state of the Moment Budget section for the Moment Shroud.
                              chat_activity_hub_view_preference:
                                type:
                                - string
                                - 'null'
                                description: Determines inital view mode of Chat & Activity panels.
                                enum:
                                - all_activity
                                - chat
                                - activity
                              collapsed_sections:
                                type:
                                - array
                                - 'null'
                                items:
                                  type: string
                                  enum:
                                  - moment_hub_bucket
                                  - post_note_bucket
                                  - moment_note_bucket
                                description: Listed sections will be collapsed by default in the Moment Shroud and Content Composer sidebars.
                              content_queue_filters_open:
                                type:
                                - boolean
                                - 'null'
                                description: Determines initial collapse state of the filter panel in Content Queue.
                              current_brand_id:
                                type:
                                - integer
                                - 'null'
                                description: The most recently viewed workspace for the user.
                              longform_editor_theme:
                                type:
                                - string
                                - 'null'
                                description: Determines inital theme for Longform content type
                                enum:
                                - light
                                - dark
                              moment_shroud_card_view:
                                type:
                                - object
                                - 'null'
                                description: Determines initial content card display mode in the Moment Shroud.
                                additionalProperties: false
                                properties:
                                  id:
                                    type: number
                                    description: Corresponding ID value for `title`. 1 for Content card, 2 for Content only.
                                  title:
                                    type: string
                                    enum:
                                    - Content card
                                    - Content only
                              moment_shroud_layout:
                                type:
                                - object
                                - 'null'
                                description: Determines initial content card layout in the Moment Shroud.
                                additionalProperties: false
                                properties:
                                  id:
                                    type: number
                                    description: Corresponding ID value for `title`. 1 for Mosaic, 2 for Column, 3 for Seamless.
                                  title:
                                    type: string
                                    enum:
                                    - Mosaic
                                    - Column
                                    - Seamless
                              moments_filters_open:
                                type:
                                - boolean
                                - 'null'
                                description: Determines initial collapse state of the filter panel in Day, Week, and Month Views.
                              pinned_brand_ids:
                                type:
                                - array
                                - 'null'
                                description: Determines prioritized workspaces in Workspace Directory
                                items:
                                  type: string
                              post_view_modes:
                                type:
                                - object
                                - 'null'
                                description: Determines initial view mode for each Content Type
                                additionalProperties:
                                  type: string
                              stories_filters_open:
                                type:
                                - boolean
                                - 'null'
                                description: Determines initial collapse state of the filter panel in Story View.
                              timeslice_duration:
                                type:
                                - string
                                - 'null'
                                description: Determines initial time scale Mode of Moments View.
                                enum:
                                - day
                                - week
                                - month
                          relationships:
                            type: object
                            required:
