                            properties:
                              analytics_shortname:
                                type: string
                              app_environment:
                                type: string
                              app_version:
                                type: string
                              datadog_trace_enabled:
                                type: boolean
                          attributes:
                            type: object
                            required:
                            - created_at
                            - name
                            - status
                            - subdomain
                            - updated_at
                            - uuid
                            additionalProperties: false
                            properties:
                              created_at:
                                type: string
                                format: date-time
                                description: An ISO8601 date-time.
                                readOnly: true
                              name:
                                type: string
                              status:
                                type: string
                              subdomain:
                                type: string
