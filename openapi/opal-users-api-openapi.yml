    get:
      tags:
      - Users
      operationId: ReadUsersV2
      summary: List all users in the requesting users Opal
      security:
      - oauth2:
        - offline_access
      - api_key:
        - Session-Token
      parameters:
      - name: include
        in: query
        required: false
        description: A comma separated list of related objects to include
        schema:
          type: array
          items:
            type: string
            enum:
            - avatar_asset_reference
            - brand_admin_users
            - brands
            - brands.logo
            - brands.dispatch_providers
            - moments_setting
            - opal
            - opal.plan
            - primary_brand
            - profile
            - role
        style: form
        explode: false
      - name: fields
        in: query
        description: An object keyed by resource type, i.e. \"story\" or a story relationship, where each value is a CSV of attributes to include in the response.
        required: false
        schema:
          type: object
          properties:
            story:
              type: string
        style: deepObject
        explode: true
      - name: filter
        in: query
        description: 'Filters for limiting the results. Default scoped to the requesting user''s Opal.

          All timestamp filters (`created_at`, `updated_at`) use the syntax `filter[field_name][gt]=2020-01-01T00:00:00-07:00`.

          Timestamps use iso8601 formatting, such as `YYYY-MM-DD` or `YYYY-MM-DDThh:mmTZD`. Timestamps of the form `YYYY-MM-DD` will be converted to `YYY-MM-DDT00:00:00` in the `America/Los_Angeles` timezone. For example, `filter[created_at]=2020-01-01` is equivalent to `filter[created_at][gteq]=2020-01-01`.

          `eq` will convert a date to a 24 hour range. Thus `filter[created_at][eq]=2020-01-01` is equivalent to `filter[created_at][gteq]=2020-01-01T00:00:00-08:00&filter[created_at][lteq]=2020-01-02T00:00:00-08:00`.

          '
        required: false
        schema:
          type: object
          properties:
            brand_id:
              type: array
              description: 'Comma separated list of brand IDs. If included, will only fetch users with memberships in the provided brands in the requesting users Opal. For example, `filter[brand_id]=1` will fetch all users in brand 1, while `filter[brand_id]=1,2,3` will fetch any user in brand 1, 2, or 3.

                '
              items:
                type: integer
            created_at:
              allOf:
              - type: object
                properties:
                  eq:
                    type: string
                    description: 'Equal to filter. If no other filter is specified, `eq` will be assumed.

                      '
                  gt:
                    type: string
                    description: Greater than filter
                  gteq:
                    type: string
                    description: Greater than or equal to filter
                  lt:
                    type: string
                    description: Less than filter
                  lteq:
                    type: string
                    description: Less than or equal to filter
              - format: date-time
              - description: 'Filter users by created_at time. Uses syntax `filter[created_at][gt]=2020-01-01T00:00:00-07:00`

                  '
            is_active:
              type: boolean
              description: 'Boolean true returns active users, while boolean false returns deactivated users. Omission will return all users.

                NOTE: soft-deleted users cannot be returned.

                '
            role:
              type: array
              description: 'Comma separated list of user roles. If included, will only fetch users with provided user roles. For example, `filter[role]=admin` will fetch all users with the "admin" user role, while `filter[role]=admin,user` will fetch any user with roles "admin" or "user".

                '
              items:
                type: string
                enum:
                - admin
                - opal_admin
                - user
                - view_only
                - limited
            updated_at:
              allOf:
              - type: object
                properties:
                  eq:
                    type: string
                    description: 'Equal to filter. If no other filter is specified, `eq` will be assumed.

                      '
                  gt:
                    type: string
                    description: Greater than filter
                  gteq:
                    type: string
                    description: Greater than or equal to filter
                  lt:
                    type: string
                    description: Less than filter
                  lteq:
                    type: string
                    description: Less than or equal to filter
              - format: date-time
              - description: "Filter by the user updated_at time. Uses syntax `filter[updated_at][gt]=2020-01-01T00:00:00-07:00`.\n  brand_id:\n"
            primary_brand_id:
              type: integer
              description: 'Filter by the users primary brand id. A user''s primary brand is the first brand they joined chronologically unless manually set.

                '
            name:
              type: string
              description: Filters by the users full name matching any user where the term provided is a substring of the first name or last name.
        style: deepObject
        explode: true
      - name: sort
        in: query
        description: 'A comma separated value specifying how a collection in the response body should be sorted, where each value is an attribute of the user. When specifying multiple values, each value in the sequence determines the ordering precedence.

          Each user in the collection will appear in ascending order, unless any of the enumerated values are prefixed with a minus "-" sign, in which case each user will appear in descending order for the specified values.

