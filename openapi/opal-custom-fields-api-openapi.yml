  /loupe/v3/custom_fields/{custom_field_id}:
    get:
      tags:
      - Custom Fields
      operationId: ReadCustomFieldV3
      summary: Get a CustomField
      security:
      - oauth2:
        - offline_access
      - api_key: []
      parameters:
      - name: custom_field_id
        in: path
        required: true
        description: The ID of the CustomField.
        schema:
          type: string
          format: uuid
      - name: include
        in: query
        required: false
        description: A comma separated value of related objects to include.
        schema:
          type: array
          items:
            type: string
            enum:
            - custom_field_type
            - active_options
            - active_options.custom_field_color
            - deleted_options
            - deleted_options.custom_field_color
        style: form
        explode: false
      responses:
        '200':
          description: The requested Custom Field
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    title: custom_field
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    - relationships
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        format: uuid
                      type:
                        type: string
                        enum:
                        - custom_field
                      attributes:
                        type: object
                        required:
                        - description
                        - display_name
                        - is_deactivated
                        - is_color_disabled
                        - is_cascading
                        - is_system_generated
                        - metadata
                        - created_at
                        - updated_at
                        additionalProperties: false
                        properties:
                          display_name:
                            type: string
                            description: 'The display name which will appear in the Opal application UI where used.

                              '
                          description:
                            type:
                            - string
                            - 'null'
                            description: A plain text description of the custom field.
                          is_deactivated:
                            type: boolean
                            description: 'A true/false value indicating whether this custom field is available

                              for use within the Opal application. Note that this is separate from

                              deleting the custom field.

                              '
                          is_color_disabled:
                            type: boolean
                            description: 'Controls whether color relationships defined on options are displayed in the

                              UI. When true, colors are hidden without removing the underlying color relationship settings.

                              '
                          is_cascading:
                            type: boolean
                            description: 'PROPOSED:

                              Indicates if blocks whose block_type has this custom_field enabled

                              will inherit the values set for this custom field from its nearest

                              ancestor block. Setting explicit values for this custom_field on a

                              block will override inherited values.

                              '
                          is_system_generated:
                            type: boolean
                            default: false
                            readOnly: true
                            description: 'Whether this field was auto-generated by the system rather than

                              created by a user.


                              Such fields currently cannot be renamed or deleted, though this may

                              change in the future. Relevant for fields like the ‘Status’

                              single-select.'
                          metadata:
                            type:
                            - object
                            - 'null'
                            deprecated: true
                            description: 'You **SHOULD NOT** read this data. Instead, you **SHOULD** add

                              `active_options` (and, if relevant, `deleted_options`) to the

                              `custom_fields` request’s `include` query, and use the included

                              `custom_field_option` resources.


                              Explanation: serializing a few attributes from relationships in the

                              `metadata` attribute was convenient for internal use while the

                              `custom_field` resource was in development, but it’s not compliant

                              with JSON:API, and the `include` approach is superior anyhow as allows

                              callers full control over what data is included. `metadata/options`

                              also has a different implementation than `custom_field_option`

                              resources, so there’s some risk the two representations will become

                              inconsistent.'
                            oneOf:
                            - title: Empty Object
                              type:
                              - object
                              - 'null'
                              additionalProperties: false
                              description: 'The empty object for custom fields based on custom field types which

                                have no configurable settings.

                                '
                            - title: Single Select Metadata (V1)
                              type: object
                              required:
                              - options
                              properties:
                                options:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                    - id
                                    - display_name
                                    - position
                                    properties:
                                      id:
                                        type: string
                                        description: The ID of the option. Must be globally unique and a UUID.
                                      display_name:
                                        type: string
                                        description: The display value for this option. Must be unique across non-deleted siblings.
                                      position:
                                        type: integer
                                        description: The ordinal position of this option. Must be unique across non-deleted siblings.
                                      deleted_at:
                                        type:
                                        - string
                                        - 'null'
                                        format: date-time
                                        description: 'An ISO8601 date-time value, which will remove the given option from being usable.

                                          Once an option is created, it cannot be outright removed from the system. Instead, it can be deactivated by setting this value to a date-time value.

                                          One can set this to a value to remove the option from being usable, or null to restore it and make it usable again.

                                          Note that setting this to null will only be successful if doing so does not clobber the position or name of another non-deleted sibling.

                                          '
                                      relationships:
                                        type: object
                                        additionalProperties: false
                                        properties:
                                          custom_field_color:
                                            allOf:
                                            - type: object
                                              required:
                                              - data
                                              additionalProperties: false
                                              properties:
                                                data:
                                                  type:
                                                  - object
                                                  - 'null'
                                                  required:
                                                  - id
                                                  - type
                                                  additionalProperties: false
                                                  properties:
                                                    id:
                                                      type: string
                                                      format: uuid
                                                    type:
                                                      type: string
                                                      enum:
                                                      - custom_field_color
                                            description: 'A relationship to a color for this option. Can be omitted (no color),

                                              included with null data (explicitly no color), or included with

                                              valid color data.

                                              '
                                          paired_label:
                                            allOf:
                                            - type: object
                                              required:
                                              - data
                                              additionalProperties: false
                                              properties:
                                                data:
                                                  type:
                                                  - object
                                                  - 'null'
                                                  required:
                                                  - id
                                                  - type
                                                  additionalProperties: false
                                                  properties:
                                                    id:
                                                      type: string
                                                    type:
                                                      type: string
                                                      enum:
                                                      - label
                                            description: 'A relationship to a label that’s been paired with this option.

                                              '
