- url: https://login.ouropal.com
tags:
- name: Boards
paths:
  /boards/v3:
    get:
      tags:
      - Boards
      operationId: ReadBoardsV3
      summary: Get Boards available to the authenticated user.
      security:
      - oauth2:
        - offline_access
      - api_key: []
      parameters:
      - name: filter
        in: query
        description: 'Filters for limiting the results.

          '
        required: false
        schema:
          type: object
          properties:
            workspace_id:
              type: array
              description: 'The IDs of the workspaces to which results should be filtered.

                Comma separated list of IDs. If included, will only fetch resources associated with these workspaces. If not included, will return resources associated with all workspaces that the user belongs to. For example, `filter[workspace_id]=798ac6d9-b3fc-4155-88ee-237f43f3404b` will fetch all resources associated with workspace `798ac6d9-b3fc-4155-88ee-237f43f3404b`, while `filter[workspace_id]=798ac6d9-b3fc-4155-88ee-237f43f3404b,d79e513e-9246-454e-80bf-8268bc39cd6e,f2b19a4a-ba0c-49be-8aa7-a1bf68a4a4ed` will fetch any resources associated with workspaces `798ac6d9-b3fc-4155-88ee-237f43f3404b`, `d79e513e-9246-454e-80bf-8268bc39cd6e`, or `f2b19a4a-ba0c-49be-8aa7-a1bf68a4a4ed`.

                '
              items:
                type: string
                format: uuid
            id:
              type: array
              description: 'The IDs of the resources that should be returned.

                Comma separated list of IDs. If included, will only attempt to fetch resources matching those  IDs. (Note that some or all resources may not be available.) If not included, will return all resources matching the other provided filters. For example, `filter[id]=798ac6d9-b3fc-4155-88ee-237f43f3404b` will fetch the resource with id `798ac6d9-b3fc-4155-88ee-237f43f3404b`, while `filter[id]=798ac6d9-b3fc-4155-88ee-237f43f3404b,d79e513e-9246-454e-80bf-8268bc39cd6e,f2b19a4a-ba0c-49be-8aa7-a1bf68a4a4ed` will fetch each of the resources with the ids `798ac6d9-b3fc-4155-88ee-237f43f3404b`, `d79e513e-9246-454e-80bf-8268bc39cd6e`, or `f2b19a4a-ba0c-49be-8aa7-a1bf68a4a4ed`.

                '
              items:
                type: string
                format: uuid
            is_archived:
              description: By default archived boards are omitted. Set this filter to `true` to retrieve archived boards.
              type: boolean
            is_starred:
              description: Setting to `true` will only returns boards that the current user has ‘starred’.
              type: boolean
        style: deepObject
        explode: true
      - name: include
        in: query
        required: false
        description: A comma separated value of related objects to include.
        schema:
          type: array
          items:
            type: string
            enum:
            - asset_reference
            - board_collaborators
            - board_objects
            - board_columns
            - board_user_setting
            - collaborators
            - collaborators.profile
            - collaborators.profile.avatar_asset_reference
            - object_collections
            - created_by_user
            - created_by_user.profile
            - created_by_user.profile.avatar_asset_reference
            - default_story
        style: form
        explode: false
      - name: fields
        in: query
        description: 'A JSON:API [sparse fieldset](https://jsonapi.org/format/#fetching-sparse-fieldsets) declaration. The resource type can be that of the primary resource (i.e. `board`) or any of the included resources (e.g. `title` or `workspace`).

          '
        required: false
        schema:
          type: object
          properties:
            asset_reference:
              type: string
            board:
              type: string
            board_columns:
              type: string
            board_collaborators:
              type: string
            board_objects:
              type: string
            board_user_setting:
              type: string
            collaborators:
              type: string
            created_by_user:
              type: string
            object_collections:
              type: string
            workspace:
              type: string
        style: deepObject
        explode: true
      - name: sort
        in: query
        description: 'A comma separated value specifying how a collection in the response body should be sorted, where each value is an attribute of the board. When specifying multiple values, each value in the sequence determines the ordering precedence.


          Each board in the collection will appear in ascending order, unless any of the enumerated values are prefixed with a minus "-" sign, in which case each board will appear in descending order for the specified values.

          '
        required: false
        schema:
          type: string
          enum:
          - created_at
          - -created_at
          - updated_at
          - -updated_at
          - title
          - -title
      - name: page
        description: Specify an offset and limit for pagination
        in: query
        required: false
        schema:
          type: object
          properties:
            limit:
              type: integer
              default: 50
            offset:
              type: integer
        style: deepObject
        explode: true
      responses:
        '200':
          description: A collection of Boards.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      title: board
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      - relationships
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          enum:
                          - board
                        attributes:
                          type: object
                          required:
                          - created_at
                          - description
                          - is_public
                          - is_archived
                          - title
                          - updated_at
                          additionalProperties: false
                          properties:
                            created_at:
                              type: string
                              format: date-time
                              description: An ISO8601 date-time.
                              readOnly: true
                            description:
                              type:
                              - string
                              - 'null'
                              description: A description of the board.
                            is_public:
                              type: boolean
                              description: 'Indicates whether or not a board and all of its contents are visible

                                to users in the workspace. Unless otherwise specified, this value is

                                `false` by default. Boards are always visible to the user that created

                                them.

                                '
                            is_archived:
                              type: boolean
                              description: 'Indicates whether or not a board has been archived. If set to

                                `true`, the UI will only display the board in the ‘Archived

                                Boards’ view. If set to `false` (the default), the board may be

                                displayed in other views, depending on the user’s filter

                                settings.

                                '
                            title:
                              type: string
                              description: The name of the board.
                            updated_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: An ISO8601 date-time.
                              readOnly: true
                        relationships:
                          type: object
                          additionalProperties: false
