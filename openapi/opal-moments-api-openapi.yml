      - api_key: []
      parameters:
      - name: moment_id
        in: path
        required: true
        description: The UUID of the Moment.
        schema:
          type: string
      - name: fields
        in: query
        description: 'A JSON:API [sparse fieldset](https://jsonapi.org/format/#fetching-sparse-fieldsets) declaration. The resource type can be that of the primary resource (i.e. `moment`) or any of the included resources (e.g. `channel` or `workspace`).

          '
        required: false
        schema:
          type: object
          properties:
            board_object:
              type: string
            channel:
              type: string
            moment:
              type: string
            note:
              type: string
            primary_asset_reference:
              type: string
            primary_story:
              type: string
            story:
              type: string
            workspace:
              type: string
        style: deepObject
        explode: true
      - name: include
        in: query
        required: false
        description: A comma separated value of related objects to include.
        schema:
          type: array
          items:
            type: string
            enum:
            - board_objects
            - channels
            - note
            - owner
            - primary_asset_reference
            - primary_story
            - stories
            - workspace
            - schedules
        style: form
        explode: false
      - name: expose
        in: query
        required: false
        description: 'Optionally calculated moment metadata which are not part of responses by default.


          You request that metadata be included in responses with the `expose` query

          parameter like: `/moments/v3/moments?expose[moment][meta]` or `expose[meta][access]`.

