                  - 'null'
                  description: 'Information about who has access to the given resource. This

                    metadata is only available for single (non-batch) `GET` / `PATCH` /

                    `POST` requests, and is not returned by default. Add

                    `expose[meta][access]` to your query parameters to request it in the

                    response body.

                    '
            moment:
              type: object
              properties:
                meta:
                  type:
                  - string
                  - 'null'
                  description: 'Exposing the metadata on each moment resource populates the

                    `meta` key with calculated attributes. If metadata is not

                    exposed, the `meta` key will be an empty object. Detailed

                    documentation on each metadata attribute is available in the

                    response schema documentation.


                    You can specify all moment metadata as `expose[moment][meta]`

                    or any combination of comma separated values from:

                    `is_stamp_template`, `effective_privacy`.


                    For example,

                    `expose[moment][meta]=is_stamp_template,effective_privacy`.


                    Note that if you expose the effective_privacy moment

