        description: 'Optionally calculated moment metadata which are not part of responses by default.


          You request that metadata be included in responses with the `expose`

          query parameter like: `/moments/v3/moments?expose[moment][meta]` or more

          granularly `?expose[moment][meta]=is_stamp_template`.

