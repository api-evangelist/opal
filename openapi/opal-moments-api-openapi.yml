                    response schema documentation.


                    You can specify all moment metadata as `expose[moment][meta]`

                    or any combination of comma separated values from:

                    `is_stamp_template`, `effective_privacy`.


                    For example,

                    `expose[moment][meta]=is_stamp_template,effective_privacy`.


                    Note that if you expose the effective_privacy moment

                    metadata then all moments in the response must belong to the

                    same workspace. In this case, you are required to use the

                    `filter[workspace_id]` query parameter with a single

                    workspace ID.

                    '
      - name: page
        description: Specify an offset and limit for pagination
        in: query
        required: false
        schema:
          type: object
          properties:
            limit:
              type: integer
              default: 50
            offset:
              type: integer
        style: deepObject
