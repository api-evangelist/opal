              example:
                data:
                - id: '2'
                  type: activity
                  attributes:
                    comment: this is an activity comment
                    created_at: '2019-01-14T15:27:01.881-08:00'
                  relationships:
                    asset_references:
                      data: []
                    user:
                      data:
                        id: '986288609'
                        type: user
                    activity_type:
                      data:
                        id: '70'
                        type: activity_type
                    reactions:
                      data: []
                - id: '3'
                  type: activity
                  attributes:
                    comment: this is an activity comment
                    created_at: '2019-01-14T15:27:01.958-08:00'
                  relationships:
                    asset_references:
                      data: []
                    user:
                      data:
                        id: '986288610'
                        type: user
                    activity_type:
                      data:
                        id: '71'
                        type: activity_type
                    reactions:
                      data:
                      - id: '1'
                        type: reaction
                      - id: '2'
                        type: reaction
                meta:
                  total: 2
                  page:
                    limit: 50
                    offset: 0
        '404':
          description: Content not found.
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                        title:
                          type: string
                        detail:
                          type: string
                      required:
                      - status
    post:
      tags:
      - Activities
      operationId: CreateActivityV1
      summary: Create an activity for a given moment or piece of content
      security:
      - oauth2:
        - offline_access
      - api_key:
        - Session-Token
      parameters:
      - name: entity_type
        in: path
        required: true
        description: The type of object to fetch activities for
        schema:
          type: string
          enum:
          - content
          - moments
      - name: entity_id
        in: path
        required: true
        description: The ID of the entity to fetch activities for. The type is determined by the entity_type parameter
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      enum:
                      - activity
                    attributes:
                      type: object
                      properties:
                        comment:
                          type:
                          - string
                          - 'null'
                          description: Chat message, if set.
            example:
              data:
                type: activity
                attributes:
                  comment: Test comment
      responses:
        '200':
          description: Activity sucessfully created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    title: activity
                    type: object
                    required:
                    - relationships
                    - id
                    - attributes
                    - type
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        pattern: ^[0-9]+$
                      type:
                        type: string
                        enum:
                        - activity
                      relationships:
                        type: object
                        additionalProperties: false
                        properties:
                          user:
                            type: object
                            required:
                            - data
                            additionalProperties: false
                            properties:
                              data:
                                type: object
                                required:
                                - id
                                - type
                                additionalProperties: false
                                properties:
                                  id:
                                    type: string
                                  type:
                                    type: string
                                    enum:
                                    - user
                          activity_type:
                            type: object
                            required:
                            - data
                            additionalProperties: false
                            properties:
                              data:
                                type: object
                                required:
                                - id
                                - type
                                additionalProperties: false
                                properties:
                                  id:
                                    type: string
                                  type:
                                    type: string
                                    enum:
                                    - activity_type
                          asset_references:
                            type: object
                            required:
                            - data
                            additionalProperties: false
                            properties:
                              data:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - id
                                  - type
                                  additionalProperties: false
                                  properties:
                                    id:
                                      type: string
                                    type:
                                      type: string
                                      enum:
                                      - asset_reference
