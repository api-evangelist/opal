  /activities/v1/{entity_type}/{entity_id}/checkpoint:
    get:
      tags:
      - Activities
      operationId: ReadCheckpointV1
      summary: Returns latest checkpoint for a given entity and user
      security:
      - oauth2:
        - offline_access
      - api_key:
        - Session-Token
      parameters:
      - name: entity_type
        in: path
        required: true
        description: The type of object to fetch activities for
        schema:
          type: string
          enum:
          - content
          - moment
      - name: entity_id
        in: path
        required: true
        description: The ID of the entity to fetch activities for. The type is determined by the entity_type parameter
        schema:
          type: string
      responses:
        '200':
          description: The latest checkpoint for the given entity
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    title: checkpoint
                    type: object
                    required:
                    - relationships
                    - id
                    - attributes
                    - type
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        pattern: ^[0-9]+$
                      type:
                        type: string
                        enum:
                        - checkpoint
                      relationships:
                        type: object
                        required:
                        - user
                        additionalProperties: false
                        properties:
                          user:
                            type: object
                            required:
                            - data
                            additionalProperties: false
                            properties:
                              data:
                                type: object
                                required:
                                - id
                                - type
                                additionalProperties: false
                                properties:
                                  id:
                                    type: string
                                  type:
                                    type: string
                                    enum:
                                    - user
                      attributes:
                        type: object
                        required:
                        - checkpoint
                        - section
                        - created_at
                        additionalProperties: false
                        properties:
                          checkpoint:
                            type: integer
                            description: 'Depending on the context, this property is used differently.


                              In the context of an Activity Checkpoint, this property will be set to the ID of the activity on which the checkpoint is being created.

                              Note that this ID *IS* sent as an integer, not a string.

                              '
                          created_at:
                            type: string
                            format: date-time
                            description: An ISO8601 date-time.
                            readOnly: true
                          section:
                            type: string
                            enum:
                            - activity
