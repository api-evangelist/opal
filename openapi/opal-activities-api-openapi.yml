                data:
                  id: '5'
                  type: checkpoint
                  attributes:
                    checkpoint: 7
                    created_at: '2019-01-31T15:57:49.032Z'
                    section: activity
                  relationships:
                    user:
                      data:
                        id: '593363170'
                        type: user
