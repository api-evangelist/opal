        '204':
          description: No current rich text found
        '404':
          description: Requested Object not found
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                        title:
                          type: string
                        detail:
                          type: string
                      required:
                      - status
        '422':
          description: Request parameters could not be processed
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                        title:
                          type: string
                        detail:
                          type: string
                      required:
                      - status
  /rich_texts/v1/{entity_type}/{entity_id}:
    post:
      tags:
      - Rich Texts
      operationId: CreateRichTextV1
      summary: Create a rich_text object, given creator entity_type and entity_id
      security:
      - oauth2:
        - offline_access
      - api_key:
        - Session-Token
      parameters:
      - name: entity_type
        in: path
        required: true
        description: The JSON:API resource type of entity the rich text belongs to
        schema:
          type: string
          enum:
          - content
      - name: entity_id
        in: path
        required: true
        description: The id of the entity the rich text belongs to
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - attributes
                  - type
                  properties:
                    type:
                      type: string
                      enum:
                      - rich_text
                    attributes:
                      type: object
                      properties:
                        editor_content:
                          type:
                          - string
                          - 'null'
                    relationships:
                      type: object
                      properties:
                        parent:
                          type: object
                          required:
                          - data
                          additionalProperties: false
                          properties:
                            data:
                              type:
                              - object
                              - 'null'
                              required:
                              - id
                              - type
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                type:
                                  type: string
