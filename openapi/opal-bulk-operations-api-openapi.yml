                                type: object
                                description: JSON:API data to use for the given API operation. This **MUST** match the documented data (`data`) in the request schema of the specified API Operation. This field **MUST** be present for `Create*` and `Update*` operations, and **MUST** be omitted for `Read*` and `Delete*` operations.
