tags:
- name: Bulk Operations
  description: '## Bulk Operations


    A Bulk Operation represents a number of individual actions to be performed.


    ### Terms

    - **``Operation ID``**: A unique string identifier that corresponds to a

    specific individual operation that can be made for a resource. If the request

    is usable in the context of a bulk operation, the endpoint will have this

    identifier documented as "Operation-ID".'
paths:
