openapi: 3.2.0
info:
  version: 2.0.0
  title: Opal Services API
  license:
    name: Opal API License
    url: https://www.workwithopal.com/api-license
  description: The key words “MUST”, “MUST NOT”, “REQUIRED”, “SHALL”, “SHALL NOT”, “SHOULD”, “SHOULD NOT”, “RECOMMENDED”, “NOT RECOMMENDED”, “MAY”, and “OPTIONAL” in this document are to be interpreted as described in BCP 14 [RFC2119] [RFC8174] when, and only when, they appear in all capitals, as shown here.
servers:
- url: https://login.ouropal.com
tags:
- name: Services
paths:
  /services/v2:
    get:
      tags:
      - Services
      summary: Returns a list of Services
      operationId: ReadServicesV2
      security:
      - oauth2:
        - offline_access
      - api_key:
        - Session-Token
      parameters:
      - name: include
        in: query
        required: false
        description: A comma separated list of related objects to include
        schema:
          type: array
          items:
            type: string
            enum:
            - accounts
            - asset_reference
            - post_types
        style: form
        explode: false
      - name: filter
        in: query
        description: 'Filters for limiting the results.

          '
        required: false
        schema:
          type: object
          properties:
            brand_id:
              type: array
              description: 'The IDs of the workspaces to which results should be filtered.

                "Workspace ID" and "Brand ID" are synonymous.

                Comma separated list of IDs. If included, will only fetch resources associated with these brands. If not included, will return resources associated with all brands that the user belongs to. For example, `filter[brand_id]=1` will fetch all resources associated with brand 1, while `filter[brand_id]=1,2,3` will fetch any resources associated with brands 1, 2, or 3.

                Note that "standard" services common to all brands such as Facebook or Twitter will have a `null` brand_id and can be filtered as such. For example `filter[brand_id]=null` will return only standard services, and `filter[brand_id]=null,1,2` will return all standard services, plus any custom services for brands 1 and 2.

                '
              items:
                oneOf:
                - type: string
                - type: integer
        style: deepObject
        explode: true
      - name: sort
        in: query
        description: 'A comma separated value specifying how a collection in the response body should be sorted, where each value is an attribute of the story. When specifying multiple values, each value in the sequence determines the ordering precedence.

          Each service in the collection will appear in ascending order, unless any of the enumerated values are prefixed with a minus "-" sign, in which case each story will appear in descending order for the specified values.

          If no sort parameter is provided, services will be default sorted by created_at, ascending.

          '
        required: false
        schema:
          type: string
          enum:
          - created_at
          - updated_at
      - name: page
        description: Specify an offset and limit for pagination
        in: query
        required: false
        schema:
          type: object
          properties:
            limit:
              type: integer
              default: 50
            offset:
              type: integer
        style: deepObject
        explode: true
      responses:
        '200':
          description: An array of services
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      title: service
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      - relationships
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          pattern: ^[0-9]+$
                        type:
                          type: string
                          enum:
                          - service
                        attributes:
                          type: object
                          required:
                          - color
                          - content_name
                          - icon_name
                          - name
                          - system_name
                          - uuid
                          - web_modules_channel
                          additionalProperties: false
                          properties:
                            color:
                              type: string
                              description: A hex color value with leading hash symbol intact
                            content_name:
                              type: string
                              description: The default name of content for this service
                            created_at:
                              type: string
                              format: date-time
                              description: An ISO8601 date-time indicating when the service was created.
                              readOnly: true
                            has_placements:
                              type:
                              - boolean
                              - 'null'
                              description: Indicates if the service supports placements capability
                            icon_name:
                              type:
                              - string
                              - 'null'
                            icon_path:
                              type:
                              - string
                              - 'null'
                            is_active:
                              type: boolean
                              description: Indicates active status of the service
                            is_visible:
                              type: boolean
                              description: Indicates visibility of the service
                            name:
                              type: string
                            system_name:
                              type: string
                            updated_at:
                              type: string
                              format: date-time
                              description: An ISO8601 date-time indicating when the service was last updated.
                              readOnly: true
                            uuid:
                              type: string
                              format: uuid
                            web_modules_channel:
                              type:
                              - boolean
                              - 'null'
                              description: Indicates if the service is of the category "web modules"
                        relationships:
                          type: object
                          required:
                          - accounts
                          - asset_reference
                          - brand
                          - post_types
                          additionalProperties: false
                          properties:
                            accounts:
                              type: object
                              required:
                              - data
                              additionalProperties: false
                              properties:
