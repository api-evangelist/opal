  /rich_texts/v3/documents/{rich_text_document_id}:
    get:
      tags:
      - Rich Text Documents
      operationId: ReadRichTextDocumentV3
      summary: Get a Rich Text Document
      security:
      - oauth2:
        - offline_access
      - api_key: []
      - presentation_share_cookie: []
      description: Returns a rich text document with its metadata and embedded resources.
      parameters:
      - name: rich_text_document_id
        in: path
        required: true
        description: The ID of the Rich Text Document.
        schema:
          type: string
          format: uuid
      - name: include
        in: query
        required: false
        description: A comma separated value of related objects to include.
        schema:
          type: array
          items:
            type: string
            enum:
            - assets
            - embedded_resources
        style: form
        explode: false
      responses:
        '200':
          description: The requested Rich Text Document
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    title: rich_text_document
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    - relationships
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        format: uuid
                      type:
                        type: string
                        enum:
                        - rich_text_document
                      attributes:
                        type: object
                        required:
                        - body
                        - client_library
                        - created_at
                        - updated_at
                        additionalProperties: false
                        properties:
                          body:
                            type:
                            - object
                            - 'null'
                            description: 'The JSON representation of the rich text document. There is not a strict

                              requirement on the shape of the data structure beyond the requirement

                              of it being a JSON object. Note that keys within the JSON object will be

                              preserved as-is (i.e., camelCase, PascalCase, under_score, dasher-ized).

                              '
                          client_library:
                            type: string
                            description: 'The library or framework that generated the content. One could, for

                              example, set this to the NPM package version which generated the

                              rich text document for letting the caller know how to parse the response

