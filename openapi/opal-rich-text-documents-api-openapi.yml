    get:
      tags:
      - Rich Text Documents
      operationId: GetCollaborationTokenV3
      summary: Get a JWT for use with the TipTap Collaboration server.
      security:
      - oauth2:
        - offline_access
      - api_key: []
      - presentation_share_cookie: []
      description: 'Returns a JWT token for accessing rich text documents via the TipTap Collaboration server with support for identified requests (Session Token or OAuth) and anonymous requests (presentation share cookies for readonly access).

        '
      parameters:
      - name: document_id
        in: query
        required: true
        description: 'The ID of one or more Rich Text Documents for which to request access.

          '
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: permission
        in: query
        required: false
        description: 'The permission level for the token. Defaults to ''write'' if not specified.

          - write: Full edit access (requires identification via Session Token or OAuth)

          - readonly: Read-only access

          '
        schema:
          type: string
          enum:
          - readonly
          - write
          default: write
      responses:
        '200':
          description: A JWT for use with the TipTap Collaboration server.
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                - expires_at
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: integer
