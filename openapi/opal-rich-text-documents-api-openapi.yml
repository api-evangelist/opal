openapi: 3.2.0
info:
  version: 3.0.0
  title: Opal API (⚠️ WIP) Rich Text Documents API
  license:
    name: Opal API License
    url: https://www.workwithopal.com/api-license
  description: The key words “MUST”, “MUST NOT”, “REQUIRED”, “SHALL”, “SHALL NOT”, “SHOULD”, “SHOULD NOT”, “RECOMMENDED”, “NOT RECOMMENDED”, “MAY”, and “OPTIONAL” in this document are to be interpreted as described in BCP 14 [RFC2119] [RFC8174] when, and only when, they appear in all capitals, as shown here.
servers:
- url: https://login.ouropal.com
tags:
- name: Rich Text Documents
  description: '## Overview


    ### Client libraries and document formats


    Rich Text Document endpoints can accept documents in arbitrary formats.'
paths:
  /rich_texts/v3/documents:
    get:
      tags:
      - Rich Text Documents
      operationId: ReadRichTextDocumentsV3
      summary: Get Rich Text Documents available to the authenticated user
      security:
      - oauth2:
        - offline_access
      - api_key: []
      parameters:
      - name: filter
        in: query
        description: Filters for limiting the results.
        required: false
        schema:
          type: object
          properties:
            id:
              description: Retrieve Rich Text Documents having the given ID.
              type: array
              items:
                type: string
                format: uuid
        style: deepObject
        explode: true
      - name: page
        description: Specify an offset and limit for pagination
        in: query
        required: false
        schema:
          type: object
          properties:
            limit:
              type: integer
              default: 50
            offset:
              type: integer
        style: deepObject
        explode: true
      responses:
        '200':
          description: A collection of Rich Text Documents.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      title: rich_text_document
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      - relationships
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          enum:
                          - rich_text_document
                        attributes:
                          type: object
                          required:
                          - body
                          - client_library
                          - created_at
                          - updated_at
                          additionalProperties: false
                          properties:
                            body:
                              type:
                              - object
                              - 'null'
                              description: 'The JSON representation of the rich text document. There is not a strict

                                requirement on the shape of the data structure beyond the requirement

                                of it being a JSON object. Note that keys within the JSON object will be

                                preserved as-is (i.e., camelCase, PascalCase, under_score, dasher-ized).

                                '
                            client_library:
                              type: string
                              description: 'The library or framework that generated the content. One could, for

                                example, set this to the NPM package version which generated the

                                rich text document for letting the caller know how to parse the response

                                or handle upgrade situations.

                                '
                            created_at:
                              type: string
                              format: date-time
                              description: An ISO8601 date-time representing the entity's creation date-time.
                              readOnly: true
                            updated_at:
                              type: string
                              format: date-time
                              description: An ISO8601 date-time representing the entity's most recent updated date-time.
                              readOnly: true
                        relationships:
                          type: object
                          additionalProperties: false
                          required:
                          - created_by_user
                          properties:
                            created_by_user:
                              title: User
                              type: object
                              required:
                              - data
                              additionalProperties: false
                              properties:
                                data:
                                  type: object
                                  required:
                                  - id
                                  - type
                                  additionalProperties: false
                                  properties:
                                    id:
                                      type: string
                                      format: uuid
                                    type:
                                      type: string
                                      enum:
                                      - user
                            assets:
                              allOf:
                              - type: object
                                required:
                                - data
                                additionalProperties: false
                                properties:
                                  data:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                      - id
                                      - type
                                      additionalProperties: false
                                      properties:
                                        id:
                                          type: string
                                          format: uuid
                                        type:
                                          type: string
                                          enum:
                                          - asset
                              - description: 'This relationship is only populated in documents returned by /rich_texts endpoints.

                                  '
                            asset_references:
                              allOf:
                              - type: object
                                required:
                                - data
                                additionalProperties: false
                                properties:
                                  data:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                      - id
                                      - type
                                      additionalProperties: false
                                      properties:
                                        id:
                                          type: string
                                        type:
                                          type: string
                                          enum:
                                          - asset_reference
                              - description: 'This relationship is only populated in documents returned by /board_objects endpoints.

                                  '
                            embedded_resources:
                              allOf:
                              - type: object
                                required:
                                - data
                                additionalProperties: false
                                properties:
                                  data:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                      - id
                                      - type
                                      additionalProperties: false
                                      properties:
                                        id:
                                          type: string
                                        type:
                                          type: string
                                          enum:
                                          - embedded_resource
                              - description: This relationship represents embedded resources within the document.
                  meta:
                    type: object
                    required:
                    - total
                    - page
                    - resource_type
                    properties:
                      resource_type:
                        type: string
                      total:
                        type: integer
                      page:
                        type: object
                        required:
                        - limit
                        - offset
                        properties:
