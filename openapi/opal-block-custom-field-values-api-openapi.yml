                                  type: string
                                  format: date-time
                                  description: An ISO8601 date-time value
                            - title: Text
                              type: object
                              required:
                              - value
                              properties:
                                value:
                                  type: string
                                  description: A plain text value.
                            - title: URL
                              type: object
                              required:
                              - url
