                              additionalProperties: false
                              properties:
                                user_ids:
                                  type: array
                                  items:
                                    type: string
                                    format: uuid
                                  description: An array of user UUID strings representing the selected users.
                                group_ids:
                                  type: array
                                  items:
                                    type: string
                                    format: uuid
                                  description: An array of user group UUID strings representing the selected groups.
                          created_at:
                            type: string
                            format: date-time
                            description: An ISO8601 date-time representing the entity's creation date-time.
                            readOnly: true
                          updated_at:
                            type: string
                            format: date-time
                            description: An ISO8601 date-time representing the entity's most recent updated date-time.
                            readOnly: true
                      relationships:
                        type: object
                        required:
                        - block
                        - custom_field
                        additionalProperties: false
                        properties:
                          block:
                            type: object
                            required:
                            - data
                            additionalProperties: false
                            properties:
                              data:
                                type: object
                                required:
                                - id
                                - type
                                additionalProperties: false
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                  type:
                                    type: string
                                    enum:
                                    - block
                          custom_field:
                            type: object
                            required:
                            - data
                            additionalProperties: false
                            properties:
                              data:
                                type: object
                                required:
                                - id
                                - type
                                additionalProperties: false
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                  type:
                                    type: string
                                    enum:
                                    - custom_field
                          users:
                            type: object
                            required:
                            - data
                            additionalProperties: false
                            properties:
                              data:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - id
                                  - type
                                  additionalProperties: false
                                  properties:
                                    id:
                                      type: string
                                      format: uuid
                                    type:
                                      type: string
                                      enum:
                                      - user
                          groups:
                            type: object
                            required:
                            - data
                            additionalProperties: false
                            properties:
                              data:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - id
                                  - type
                                  additionalProperties: false
                                  properties:
                                    id:
                                      type: string
                                      format: uuid
                                    type:
                                      type: string
                                      enum:
                                      - user_group
                  included:
                    type: array
                    items:
                      oneOf:
                      - title: block
                        type: object
                        required:
                        - id
                        - type
                        - attributes
                        - relationships
                        additionalProperties: false
                        properties:
                          id:
                            type: string
                            format: uuid
                          type:
                            type: string
                            enum:
                            - block
                          meta:
                            type:
                            - object
                            - 'null'
                            description: 'Optionally calculated block metadata which are not part of responses by default.

                              '
                            additionalProperties: false
                            properties:
                              effective_category_type:
                                type:
                                - object
                                - 'null'
                                description: The Block resource's most immediate ancestor's Category Type. See documentation for Category Type for additional details.
                                additionalProperties: false
                                properties:
                                  id:
                                    type: string
                                    description: The Category Type's ID
                                  name:
                                    type: string
                                    description: The Category Type's display name
                                  description:
                                    type:
                                    - string
                                    - 'null'
                                    description: Optional additional descriptive text.
                                  deactivated_at:
                                    type:
                                    - string
                                    - 'null'
                                    format: date-time
                                    description: A flag indicating whether the category type is deactivated.
                              effective_privacy:
                                type: string
                                enum:
                                - whole_workspace
                                - some_but_not_all
                                description: 'The effective privacy of a resource is calculated based on all direct and

                                  inherited access. If a resource or any of its parents that it inherits

                                  access from are accessible to the entire workspace, the effective privacy

                                  is `whole_workspace`. Otherwise, the effective privacy is

                                  `some_but_not_all`.

                                  '
                              custom_fields:
                                type: array
                                description: "This metadata is available when requesting block resources from the\n`loupe/v3/blocks/{block_id}` `GET` endpoint.\n\nYou request that this metadata be included in responses with the `expose` query \nparameter like: `loupe/v3/blocks/{block_id}?expose[block][meta][custom_fields]`.\n\nEffective custom fields include both **directly assigned** and **inherited** fields from \nthe associated category type. Inherited fields may, or may not, have explicit \n`block_custom_field_value`s.\n\nThe result is a list of effective custom fields for the block. Can be empty or\ncontain multiple instances of any custom field type.\n\nOrdering:\n- Inherited custom fields appear first, ordered by the associated\n  Category Type’s saved custom field order.\n- Directly assigned custom fields (via block_custom_field_values)\n  follow, preserving their relative order as returned by the service.\n"
                                items:
                                  type: object
                                  required:
                                  - id
                                  - display_name
                                  - type
                                  - options
                                  - deactivated_options
                                  - association_type
