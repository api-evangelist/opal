      - oauth2:
        - offline_access
      - api_key: []
      parameters:
      - name: include
        in: query
        required: false
        description: A comma-separated value of related objects to include.
        schema:
          type: array
          items:
            type: string
            enum:
            - block
            - custom_field
        style: form
        explode: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - type
                  - attributes
                  - relationships
                  properties:
                    type:
                      type: string
                      enum:
                      - block_custom_field_value
                    attributes:
                      type: object
                      required:
                      - value
                      additionalProperties: false
                      properties:
                        value:
                          type:
                          - object
                          - 'null'
                          oneOf:
                          - enum:
                            - null
                          - title: Date
                            type: object
                            required:
                            - value
                            properties:
                              value:
                                type: string
                                format: date-time
                                description: An ISO8601 date-time value
                          - title: Text
                            type: object
                            required:
                            - value
                            properties:
                              value:
                                type: string
                                description: A plain text value.
                          - title: URL
                            type: object
                            required:
                            - url
                            properties:
                              label:
                                type:
                                - string
                                - 'null'
                                description: The display value for the URL.
                              url:
                                type: string
                                format: uri
                                description: The URL value.
                          - title: Single Select
                            type: object
                            required:
                            - id
                            properties:
                              id:
                                type: string
                                format: uuid
                                description: A UUID string representing the selected option.
                          - title: Multi Select
                            type: object
                            required:
                            - ids
                            properties:
                              ids:
                                type: array
                                items:
                                  type: string
                                  format: uuid
                                description: An array of UUID strings representing the selected options
                          - title: Users Select
                            type: object
                            properties:
                              user_ids:
                                type: array
                                items:
                                  type: string
                                  format: uuid
                                description: An array of user UUID strings representing the selected users
                              group_ids:
                                type: array
                                items:
                                  type: string
                                  format: uuid
                                description: An array of user group UUID strings representing the selected groups
                    relationships:
                      type: object
                      required:
                      - block
                      - custom_field
                      properties:
                        block:
                          type: object
                          required:
                          - data
                          additionalProperties: false
                          properties:
                            data:
                              type: object
                              required:
                              - id
                              - type
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                type:
                                  type: string
                                  enum:
                                  - block
                        custom_field:
                          type: object
                          required:
                          - data
                          additionalProperties: false
                          properties:
                            data:
                              type: object
                              required:
                              - id
                              - type
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                type:
                                  type: string
                                  enum:
                                  - custom_field
      responses:
        '201':
          description: A newly created Block Custom Field Value resource.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    title: block_custom_field_value
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    - relationships
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        format: uuid
                      type:
                        type: string
                        enum:
                        - block_custom_field_value
                      attributes:
                        type: object
                        required:
                        - value
                        - created_at
                        - updated_at
                        additionalProperties: false
                        properties:
                          value:
                            type:
                            - object
                            - 'null'
                            oneOf:
                            - enum:
                              - null
                            - title: Date
                              type: object
                              required:
                              - value
                              properties:
                                value:
                                  type: string
                                  format: date-time
                                  description: An ISO8601 date-time value
                            - title: Text
                              type: object
                              required:
                              - value
                              properties:
                                value:
                                  type: string
                                  description: A plain text value.
                            - title: URL
                              type: object
                              required:
                              - url
                              properties:
                                label:
                                  type:
                                  - string
                                  - 'null'
                                  description: The display value for the URL.
                                url:
                                  type: string
                                  format: uri
                                  description: The URL value.
                            - title: Single Select
                              type: object
                              required:
                              - id
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                  description: A UUID string representing the selected option.
                            - title: Multi Select
