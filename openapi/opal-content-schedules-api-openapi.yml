                              - type
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                type:
                                  type: string
                                  enum:
                                  - moment_schedule
            example:
              data:
                type: content_schedule
                attributes:
                  start_interval: PT0S
                  takedown_interval: P1DT8H
                  timezone: America/Los_Angeles
                relationships:
                  content:
                    data:
                      id: 3813a-4102-4f34-a8ca-d2cb951cf592
                      type: content
                  moment_schedule:
                    data:
                      id: 6ab599a6-2bcb-4cca-a964-a312e8afd4c8
                      type: moment_schedule
      responses:
        '201':
          description: A newly created Content Schedule resource.
