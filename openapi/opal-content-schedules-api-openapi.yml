openapi: 3.2.0
info:
  version: 3.0.0
  title: Opal API (⚠️ WIP) Content Schedules API
  license:
    name: Opal API License
    url: https://www.workwithopal.com/api-license
  description: The key words “MUST”, “MUST NOT”, “REQUIRED”, “SHALL”, “SHALL NOT”, “SHOULD”, “SHOULD NOT”, “RECOMMENDED”, “NOT RECOMMENDED”, “MAY”, and “OPTIONAL” in this document are to be interpreted as described in BCP 14 [RFC2119] [RFC8174] when, and only when, they appear in all capitals, as shown here.
servers:
- url: https://login.ouropal.com
tags:
- name: Content Schedules
paths:
  /content_schedules/v3:
    post:
      tags:
      - Content Schedules
      operationId: CreateContentScheduleV3
      summary: Create a new Content Schedule
      security:
      - oauth2:
        - offline_access
      - api_key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - type
                  - attributes
                  - relationships
                  properties:
                    type:
                      type: string
                      enum:
                      - content_schedule
                    attributes:
                      type: object
                      properties:
                        start_interval:
                          type:
                          - string
                          - 'null'
                          description: 'An ISO8601 interval. Determines the start datetime of the related

                            content, when added to the related moment_schedule''s start_at

                            attribute.

                            '
                        takedown_interval:
                          type:
                          - string
                          - 'null'
                          description: 'An ISO8601 interval. If present, determines the takedown datetime

                            of the related content, when added to the related

                            moment_schedule''s start_at attribute. If start_interval is

                            non-null, then takedown_interval must be greater than the

                            start_interval. Otherwise, takedown_interval must be greater than

                            0.

                            '
                        timezone:
                          type:
                          - string
                          - 'null'
                          description: "A timezone string in the IANA timezone format (i.e. \n'America/Los_Angeles', 'Europe/Berlin', 'Asia/Kolkata'). This\nattribute cannot be null if start_interval is non-null.\n"
                    relationships:
                      type: object
                      required:
                      - content
                      properties:
                        content:
                          type: object
                          required:
                          - data
                          additionalProperties: false
                          properties:
                            data:
                              type: object
                              required:
                              - id
                              - type
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                type:
                                  type: string
                                  enum:
                                  - content
                        moment_schedule:
                          type: object
                          required:
                          - data
                          additionalProperties: false
                          properties:
