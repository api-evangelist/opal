  /loupe/v3/block_connectors/{block_connector_id}:
    patch:
      tags:
      - Block Connectors
      operationId: UpdateBlockConnectorV3
      summary: Update a BlockConnector
      description: 'The appearance of a Block within a Category can be affected by updating the attributes of a BlockConnector resource. Additionally, a Category relationship can be specified or nullified to place the Block within a Category, or remove it respectively.

        This route accepts an optional block side-patch via its `data.included` property. This allows you to set block attributes at the same time as updating the block connector. Modifying block relationships is not supported at this time. Including the block in the request payload does not automatically mark it for include in the response payload.'
      security:
      - oauth2:
        - offline_access
      - api_key: []
      parameters:
      - name: block_connector_id
        in: path
        required: true
        description: The ID of the BlockConnector.
        schema:
          type: string
          format: uuid
      - name: include
        in: query
        required: false
        description: A comma separated value of related objects to include.
        schema:
          type: array
          items:
            type: string
            enum:
            - category
            - category.category_type
            - view
            - view.categories
            - view.colors
            - view.key_dates
            - view.parent_block
        style: form
        explode: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - id
                  - type
                  - attributes
                  - relationships
                  properties:
                    id:
                      type: string
                      format: uuid
                    type:
                      type: string
                      enum:
                      - block_connector
                    attributes:
                      type: object
                      properties:
                        row_index:
                          type: integer
                          description: A 1-based value indicating its row position relative to other rows of blocks within their bounding parent, a Category.
                        y_scale:
                          type: integer
                          description: A value indicating how tall the block will be relative to the default size.
                    relationships:
                      type: object
                      properties:
                        category:
                          type: object
                          required:
                          - data
                          additionalProperties: false
                          properties:
                            data:
                              type:
                              - object
                              - 'null'
                              required:
                              - id
                              - type
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                type:
                                  type: string
                                  enum:
                                  - category
                included:
                  type: array
                  items:
                    type: object
                    required:
                    - id
                    - type
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        format: uuid
                      type:
                        type: string
                        enum:
                        - block
                      attributes:
                        type: object
                        properties:
                          color:
                            type:
                            - string
                            - 'null'
                            description: A color applied to this block. Currently only supports hex values in the format of '#FFF' or '#FFFFFF'.
                          description:
                            type:
                            - string
                            - 'null'
                            maxLength: 256
                            description: Text describing the block. Maximum length of 256 characters.
                          title:
                            type: string
                            description: A descriptive name for the block.
                          start_at:
                            type:
                            - string
                            - 'null'
                            format: date
                            description: An ISO 8601-formatted ('YYYY-MM-DD') date marking the beginning of the span of time that this block resource represents.
                          duration:
                            type:
                            - string
                            - 'null'
                            description: 'An ISO 8601 duration string: P{n}D (days), P{n}W (weeks), or P{n}M (months).

                              Week and month units are auto-normalized to days when `start_at` is provided.

                              When only `start_at` changes, the duration is automatically recalculated.

                              When `start_at` is set to null without an explicit duration, duration is cleared.

                              '
                          row_index:
                            type: integer
                            description: 'A 1-based value indicating its row position relative to other rows of blocks within their bounding parent, a Category.


                              Setting this attribute when the block has multiple

                              block_connectors will result in an error. This attribute should

                              instead be modified directly on the relevant block_connector.

                              '
                            deprecated: true
                          y_scale:
                            type: integer
                            description: 'A value indicating how tall the block will be relative to the default size.


                              Setting this attribute when the block has multiple

                              block_connectors will result in an error. This attribute should

                              instead be modified directly on the relevant block_connector.

                              '
                            deprecated: true
                          browsable:
                            type: boolean
                            description: 'Whether this block shows up in the Plans Directory (and in the

                              future, other directories).


                              If false, the block is still accessible in the web application via

                              any parent plans or connections or even by way of direct link. It

                              just won''t show up in the Plans Directory.

                              '
                            default: false
                          is_template:
                            type: boolean
                            description: 'Whether this block is a template that can be used to create new blocks.

                              Currently, templated Blocks cannot be created from paired Blocks.

                              '
                            default: false
                          is_workspace_wide_template:
                            type: boolean
                            description: 'Whether this template is available workspace-wide. When `true`, the template can be used across all plans in the workspace. When `false`, the template is only available within its origin plan.

                              This field can only be set when `is_template` is `true`.'
                            default: false
                          template_name:
                            type:
                            - string
                            - 'null'
                            description: Display name for the template. Required when `is_template` is `true`. Cannot be set to null on a template.
                          template_description:
                            type:
                            - string
                            - 'null'
                            description: Optional description of the template's purpose.
      responses:
        '201':
          description: An updated BlockConnector resource.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    title: block_connector
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    - relationships
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        format: uuid
                      type:
                        type: string
                        enum:
