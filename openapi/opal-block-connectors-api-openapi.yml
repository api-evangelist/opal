          description: A newly created BlockConnector resource.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    title: block_connector
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    - relationships
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        format: uuid
                      type:
                        type: string
                        enum:
                        - block_connector
                      attributes:
                        type: object
                        required:
                        - row_index
                        - y_scale
                        - created_at
                        - updated_at
                        additionalProperties: false
                        properties:
                          row_index:
                            type: integer
                            description: A 1-based value indicating the connected block's row position relative to other rows of blocks within their bounding parent, a Category.
                          y_scale:
                            type: integer
                            description: A value indicating how tall the block will be relative to the default size specified in the Category.
                          created_at:
                            type: string
                            format: date-time
                            description: An ISO8601 date-time.
                            readOnly: true
                          updated_at:
                            type: string
                            format: date-time
                            description: An ISO8601 date-time.
                            readOnly: true
