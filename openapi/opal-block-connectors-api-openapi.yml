tags:
- name: Block Connectors
  description: '## Block Connectors


    Block connectors link blocks to views.'
paths:
  /loupe/v3/block_connectors:
    post:
      tags:
      - Block Connectors
      operationId: CreateBlockConnectorV3
      summary: Create a new BlockConnector
      description: 'Creating a BlockConnector functionally places a Block within a View. If a Category relationship is specified as well, the Block will also be placed within that Category, and the row_index or y_scale attributes will apply to the presentation of the Block within that Category.

        Note that a Block may only be placed within a given View once; a BlockConnector cannot be created with a View if another BlockConnector exists that connects the Block to that same View already.'
      security:
      - oauth2:
        - offline_access
      - api_key: []
      parameters:
      - name: include
        in: query
        required: false
        description: A comma separated value of related objects to include.
        schema:
          type: array
          items:
            type: string
            enum:
            - category
            - category.category_type
            - view
            - view.categories
            - view.colors
            - view.key_dates
            - view.parent_block
        style: form
        explode: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - type
                  - attributes
                  - relationships
                  properties:
                    type:
                      type: string
                      enum:
                      - block_connector
                    attributes:
                      type: object
                      properties:
                        row_index:
                          type: integer
                          description: A 1-based value indicating its row position relative to other rows of blocks within their bounding parent, a Category.
                        y_scale:
                          type: integer
                          description: A value indicating how tall the block will be relative to the default size.
                    relationships:
                      type: object
                      required:
                      - block
                      - view
                      properties:
                        block:
                          type: object
                          required:
                          - data
                          additionalProperties: false
                          properties:
                            data:
                              type: object
                              required:
                              - id
                              - type
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                type:
                                  type: string
                                  enum:
                                  - block
                        view:
                          type: object
                          required:
                          - data
                          additionalProperties: false
                          properties:
                            data:
                              type: object
                              required:
                              - id
                              - type
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                type:
                                  type: string
                                  enum:
                                  - view
                        category:
                          type: object
                          required:
                          - data
                          additionalProperties: false
                          properties:
                            data:
                              type:
                              - object
                              - 'null'
                              required:
                              - id
                              - type
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                type:
                                  type: string
                                  enum:
                                  - category
      responses:
