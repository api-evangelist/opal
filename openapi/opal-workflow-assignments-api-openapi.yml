        style: form
        explode: false
      - name: sort
        in: query
        required: false
        description: 'A comma separated value specifying how a collection in the response

          body should be sorted, where each value is an attribute of the

          workflow assignment. If no sort order is provided, resources will be default

          sorted by created_at, ascending.


          When specifying multiple values, each value in the sequence determines

          the ordering precedence. Lastly, each workflow assignment in the collection will

          appear in ascending order, unless any of the enumerated values are

          prefixed with a minus "-" sign, in which case each workflow assignment will

          appear in descending order for the specified values.


          Workflow Assignment due date is based on the stage containing the workflow assignment.

          See Stage resource metadata.

          '
        schema:
          type: string
          enum:
          - activated_at
          - assigned_user_id
          - created_at
          - created_by_user_id
          - due_date
          - position
          - updated_at
