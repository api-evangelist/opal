  /v3/workflow_assignments:
    get:
      tags:
      - Workflow Assignments
      operationId: ReadAssignmentsV3
      summary: Get a collection of workflow_assignments
      description: 'Get workflow_assignments to which the authenticated user has access.

        These are not necessarily workflow_assignments assigned to the requesting user; if you wish to get workflow_assignments that are assigned to the user making the API request, pass the `assigned_user_id` filter set to the current user''s ID.

        '
      security:
      - oauth2:
        - offline_access
      - api_key: []
      parameters:
      - name: filter
        in: query
        description: Filter the resulting workflow assignments.
        required: false
        schema:
          type: object
          properties:
            activated_at:
              allOf:
              - type: object
                properties:
                  eq:
                    type: string
                    description: 'Equal to filter. If no other filter is specified, `eq` will be assumed.

                      '
                  gt:
                    type: string
                    description: Greater than filter
                  gteq:
                    type: string
                    description: Greater than or equal to filter
                  lt:
                    type: string
                    description: Less than filter
                  lteq:
                    type: string
                    description: Less than or equal to filter
              - format: date-time
              - description: 'Filter workflow assignments by when the stage transitioned to an

                  "active" status. Uses syntax

                  `filter[activated_at][gt]=2020-01-01T00:00:00-07:00`.


                  You can filter to a particular day by omitting the

                  `gt`/`lt`/etc.: `filter[activated_at]=2020-01-01`.

                  '
            assigned_user_id:
              type: array
              items:
                type: string
                format: uuid
              description: The ID(s) of the users to which workflow assignments are given.
            assignment_type:
              type: array
              items:
                type: string
                enum:
                - approval
                - task
                - circuit_breaker
                - none
              description: The types of workflow assignments to retrieve.
            workspace_id:
              type: array
              description: 'The IDs of the workspaces to which results should be filtered.

                Comma separated list of IDs. If included, will only fetch resources associated with these workspaces. If not included, will return resources associated with all workspaces that the user belongs to. For example, `filter[workspace_id]=798ac6d9-b3fc-4155-88ee-237f43f3404b` will fetch all resources associated with workspace `798ac6d9-b3fc-4155-88ee-237f43f3404b`, while `filter[workspace_id]=798ac6d9-b3fc-4155-88ee-237f43f3404b,d79e513e-9246-454e-80bf-8268bc39cd6e,f2b19a4a-ba0c-49be-8aa7-a1bf68a4a4ed` will fetch any resources associated with workspaces `798ac6d9-b3fc-4155-88ee-237f43f3404b`, `d79e513e-9246-454e-80bf-8268bc39cd6e`, or `f2b19a4a-ba0c-49be-8aa7-a1bf68a4a4ed`.

                '
              items:
                type: string
                format: uuid
            created_at:
              allOf:
              - type: object
                properties:
                  eq:
                    type: string
                    description: 'Equal to filter. If no other filter is specified, `eq` will be assumed.

                      '
                  gt:
                    type: string
                    description: Greater than filter
                  gteq:
                    type: string
                    description: Greater than or equal to filter
                  lt:
                    type: string
                    description: Less than filter
                  lteq:
                    type: string
                    description: Less than or equal to filter
              - format: date-time
              - description: 'Filter workflow assignments by when they were created. Uses syntax

                  `filter[created_at][gt]=2020-01-01T00:00:00-07:00`.


                  You can filter to a particular day by omitting the

                  `gt`/`lt`/etc.: `filter[created_at]=2020-01-01`.

                  '
            created_by_user_id:
              type: array
              items:
                type: string
                format: uuid
              description: The ID(s) of the users that created the workflow assignment.
            due_date:
              allOf:
              - type: object
                properties:
                  eq:
                    type: string
                    description: 'Equal to filter. If no other filter is specified, `eq` will be assumed.

                      '
                  gt:
                    type: string
                    description: Greater than filter
                  gteq:
                    type: string
                    description: Greater than or equal to filter
                  lt:
                    type: string
                    description: Less than filter
                  lteq:
                    type: string
                    description: Less than or equal to filter
              - format: date-time
              - description: 'Filter workflow assignments by when they are due. Uses syntax

                  `filter[due_date][gt]=2020-01-01T00:00:00-07:00`


                  You can filter to a particular day by omitting the

                  `gt`/`lt`/etc.: `filter[due_date]=2020-01-01`.


                  You can filter to only workflow assignments without a set due date by

                  ommiting the `gt`/`lt`/etc. and filtering for null:

                  `filter[due_date]=null`.


                  Workflow Assignment due date is based on the stage containing the

                  workflow assignment. See Stage resource metadata.

                  '
            status:
              type: array
              items:
                type: string
                enum:
                - complete
                - incomplete
              description: 'The status of the workflow assignment. This is dictated by the responses (if any) to this workflow assignment.

                Note that an incomplete workflow assignment _can_ exist within a completed stage if the criteria for completing the stage was met without all workflow assignments in the stage having been completed.

                '
            stage_status:
              type: array
              items:
                type: string
                enum:
                - inactive
                - active
                - complete
              description: 'The status of the stage containing this workflow assignment.

                Note that an incomplete workflow assignment _can_ exist within a completed stage if the criteria for completing the stage was met without all workflow assignments in the stage having been completed.

                '
        style: deepObject
        explode: true
      - name: include
        in: query
        required: false
        description: 'A comma separated value of related resource objects on the workflow assignment to include.

          Note that user resources are not available as includes on this endpoint; the client must make subsequent API requests `api/v1/users` to request additional information on related users.

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - stage
            - stage.workflow
            - stage.workflow.context
