note: >-
  Opal publishes a pricing page but no priced plans, no named tiers and no self-serve checkout.
  The page states that "the best way for an Opal product expert to finalize a price and package for
  you is to have a conversation" and routes every visitor to "Talk to an Expert" / "Get a Demo".
  It does disclose the shape of the pricing model without any numbers: licensing is per user, the
  platform fee is calculated from the number of users in a workspace, and software integrations are
  priced as add-ons. There is no separate API price list — API access is not sold as a product; the
  help center says access requires an active account or an NDA plus approval from Opal leadership.
